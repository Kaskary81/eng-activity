/* ============================================================
   The grid as a spreadsheet: pick a cell, extend with shift or by
   dragging, type to edit, copy and paste blocks straight to and from
   Excel, fill down, resize a column, and wrap long text.
   ============================================================ */
let SEL=null;                 /* {r1,c1,r2,c2} in visible row/column order */
let CUR={r:0,c:0};
let GRIDROWS=[], GRIDCOLS=[];
let ANIMATE=true;          /* only the first draw of a new row set glides in */
let _lastSig='';
let WRAPCELLS=false;
try{ WRAPCELLS=localStorage.getItem('eng_wrap')==='1'; }catch(e){}

const selBox=()=>SEL?{r1:Math.min(SEL.r1,SEL.r2),r2:Math.max(SEL.r1,SEL.r2),
                      c1:Math.min(SEL.c1,SEL.c2),c2:Math.max(SEL.c1,SEL.c2)}:null;
function paintSel(){
  const b=selBox();
  document.querySelectorAll('table.g td[data-r]').forEach(td=>{
    const r=+td.dataset.r, c=+td.dataset.c;
    const on = b && r>=b.r1 && r<=b.r2 && c>=b.c1 && c<=b.c2;
    td.classList.toggle('selcell',!!on);
    td.classList.toggle('curcell', r===CUR.r && c===CUR.c);
  });
  const el=document.querySelector(`td[data-r="${CUR.r}"][data-c="${CUR.c}"]`);
  if(el&&el.scrollIntoView)el.scrollIntoView({block:'nearest',inline:'nearest'});
  const n=b?((b.r2-b.r1+1)*(b.c2-b.c1+1)):0;
  const cnt=document.getElementById('count');
  if(cnt&&n>1)cnt.dataset.sel=n+' cells';
}
/* which field a visible column writes to, and whether it may be written */
function colEditable(c){
  const map=(EDIT[TAB]||[]).reduce((m,f)=>(m[f[0]]=f,m),{});
  const doc=EDIT._doc||{};
  if(map[c.k])return map[c.k];
  if(doc[c.k])return [c.k,c.t,doc[c.k]];
  return null;
}
function cellValue(row,c){
  const v=c.calc?c.calc(row):row[c.k];
  return (v===null||v===undefined)?'':String(v);
}
/* ---- copy, paste, fill, clear ---- */
function selText(){
  const b=selBox(); if(!b)return '';
  const out=[];
  for(let r=b.r1;r<=b.r2;r++){
    const row=GRIDROWS[r]; if(!row)continue;
    const line=[];
    for(let c=b.c1;c<=b.c2;c++){
      const col=GRIDCOLS[c]; if(!col)continue;
      line.push(cellValue(row,col).replace(/\t/g,' ').replace(/\r?\n/g,' '));
    }
    out.push(line.join('\t'));
  }
  return out.join('\n');
}
async function copySel(){
  const t=selText(); if(!t)return;
  try{ await navigator.clipboard.writeText(t); }
  catch(e){ const ta=document.createElement('textarea'); ta.value=t;
    document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); }
  const b=selBox();
  toast('Copied '+((b.r2-b.r1+1)*(b.c2-b.c1+1))+' cells');
}
/* Excel puts a block on the clipboard as tab-separated lines */
async function pasteInto(text){
  if(!canEdit())return toast('You have read-only access');
  const b=selBox()||{r1:CUR.r,c1:CUR.c,r2:CUR.r,c2:CUR.c};
  const lines=String(text).replace(/\r/g,'').replace(/\n$/,'').split('\n').map(l=>l.split('\t'));
  const jobs=[];
  lines.forEach((cells,dr)=>cells.forEach((val,dc)=>{
    const row=GRIDROWS[b.r1+dr], col=GRIDCOLS[b.c1+dc];
    if(!row||!col)return;
    const f=colEditable(col); if(!f)return;
    jobs.push({row,col,f,val:val.trim()});
  }));
  if(!jobs.length)return toast('Nothing here can be pasted into');
  await applyEdits(jobs, 'Pasted');
}
async function fillDown(){
  if(!canEdit())return toast('You have read-only access');
  const b=selBox(); if(!b||b.r2===b.r1)return toast('Select the cell and the rows below it');
  const jobs=[];
  for(let c=b.c1;c<=b.c2;c++){
    const col=GRIDCOLS[c], f=col&&colEditable(col); if(!f)continue;
    const src=cellValue(GRIDROWS[b.r1],col);
    for(let r=b.r1+1;r<=b.r2;r++){
      const row=GRIDROWS[r]; if(!row)continue;
      jobs.push({row,col,f,val:src});
    }
  }
  if(!jobs.length)return toast('These columns cannot be edited');
  await applyEdits(jobs,'Filled down');
}
async function clearSel(){
  if(!canEdit())return toast('You have read-only access');
  const b=selBox(); if(!b)return;
  const jobs=[];
  for(let r=b.r1;r<=b.r2;r++)for(let c=b.c1;c<=b.c2;c++){
    const row=GRIDROWS[r], col=GRIDCOLS[c];
    const f=row&&col&&colEditable(col); if(!f)continue;
    jobs.push({row,col,f,val:''});
  }
  if(jobs.length)await applyEdits(jobs,'Cleared');
}
/* one place that writes, so paste, fill, clear and typing all behave alike */
async function applyEdits(jobs,what){
  /* jobs is filtered below, so it must not be a const */
  const undo=[];
  const byRow=new Map();
  const skipped=[];
  const asDate=v=>{
    const m=String(v).match(/^(\d{4})-(\d{2})-(\d{2})/);
    if(m)return m[0];
    const d=String(v).match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})$/);
    if(d)return d[3]+'-'+d[2].padStart(2,'0')+'-'+d[1].padStart(2,'0');
    return null;
  };
  jobs=jobs.filter(j=>{
    const kind=j.f[2], v=j.val;
    if(kind==='num' && v!=='' && isNaN(+v)){ skipped.push(j.col.t+' takes a number'); return false; }
    if(kind==='date'&& v!=='' && !asDate(v)){ skipped.push(j.col.t+' takes a date'); return false; }
    if(kind==='sel' && v!=='' && !(j.f[3]||[]).some(a=>String(a).toLowerCase()===v.toLowerCase())){
      skipped.push(j.col.t+' only takes its listed values'); return false; }
    return true;
  });
  if(!jobs.length){ toast(skipped.length?('Nothing written — '+skipped[0])
    :'Nothing here can be written to'); return; }
  jobs.forEach(j=>{
    let v=j.val;
    const kind=j.f[2];
    if(kind==='num')v = v===''?null:+v;
    if(kind==='sel'&&v!==''){
      const allowed=j.f[3]||[];
      const hit=allowed.find(a=>String(a).toLowerCase()===v.toLowerCase());
      if(hit)v=hit;
    }
    if(kind==='date'&&v!=='')v=asDate(v)||v;
    undo.push({row:j.row,k:j.col.k,before:j.row[j.col.k]});
    j.row[j.col.k]=v;
    if(!byRow.has(j.row.id))byRow.set(j.row.id,{row:j.row,patch:{}});
    byRow.get(j.row.id).patch[j.col.k]=v;
  });
  paintTable();
  let ok=0, bad=0;
  for(const {row,patch} of byRow.values()){
    try{ await api(TABLE[TAB]+'?id=eq.'+row.id,{method:'PATCH',body:JSON.stringify(patch)}); ok++; }
    catch(e){ bad++; }
  }
  if(bad){ undo.forEach(u=>u.row[u.k]=u.before); paintTable();
    toast('Could not save — nothing was changed'); }
  else { toast(what+' · '+jobs.length+' cell'+(jobs.length>1?'s':'')+' in '+ok+' record'+(ok>1?'s':'')+
    (skipped.length?(' · '+skipped.length+' skipped — '+skipped[0]):'')); }
  paintKpis&&paintKpis();
}
/* ---- editing one cell in place ---- */

/* Anything already typed into a column becomes a choice next time. The list is
   built from the values in that column across the whole register, commonest
   first, and you can still type something new — so it grows by itself instead
   of needing a list defined for every field. */

/* "＋ something else…" turns the dropdown into a text box, so a new value can
   be typed without losing the list for everyone else */
function wireCombos(scope){
  (scope||document).querySelectorAll('select[data-combo]').forEach(sel=>{
    if(sel._combo)return; sel._combo=1;
    sel.addEventListener('change',e=>{
      if(sel.value!=='__new')return;
      const k=sel.dataset.combo;
      const inp=document.createElement('input');
      inp.id=sel.id; inp.value=''; inp.placeholder='Type the new value';
      sel.replaceWith(inp); inp.focus();
      inp.onchange=()=>{ if(typeof sel.onchange==='function')sel.onchange.call(inp); };
      /* the save handler is attached by id, so re-attach it to the new box */
      if(typeof _rewireField==='function')_rewireField(k,inp);
      e.stopImmediatePropagation();
    });
  });
}


/* the choices for a select field, worked out NOW rather than when the file
   loaded — the review list depends on which client the project answers to */
/* Which client a project answers to. The column says so, but the code and
   name are checked too, so this still works if that column is ever missing. */
function projectClient(pid){
  const p=(PROJECTS||[]).find(x=>String(x.id)===String(pid));
  if(!p)return null;
  if(p.client)return p.client;
  return /rum|rjum|maaden|ma'aden/i.test((p.code||'')+' '+(p.name||'')) ? 'Maaden' : 'NWC';
}
function liveOptions(key,fallback,row){
  if(key==='review_status'||(key==='status'&&TAB==='gis')){
    const pid = (row&&row.project_id!=null) ? row.project_id : PROJ;
    const c = pid!=null ? projectClient(pid) : null;
    if(c)return c==='Maaden' ? REVIEW_MAADEN : REVIEW_NWC;
    /* looking across projects with no record in hand — offer both */
    return [...new Set([...REVIEW_NWC,...REVIEW_MAADEN])];
  }
  return fallback||[];
}

function colChoices(key,tab){
  const t=tab||TAB;
  const rows=rowsOf(t)||[];
  const count=new Map();
  rows.forEach(r=>{
    const v=r[key];
    if(v===null||v===undefined)return;
    const s=String(v).trim();
    if(!s)return;
    count.set(s,(count.get(s)||0)+1);
  });
  /* A column earns a dropdown when it holds a manageable set of values —
     discipline, zone, who has it. A document number is different on every
     row, so 217 of them would be noise; the ceiling keeps those out. */
  const list=[...count.entries()]
    .sort((a,b)=>b[1]-a[1] || String(a[0]).localeCompare(String(b[0]),undefined,{numeric:true}));
  if(!list.length || list.length>40)return [];
  return list.map(([v])=>v);
}
function datalistFor(key,tab){
  const id='dl-'+key;
  let dl=document.getElementById(id);
  if(!dl){ dl=document.createElement('datalist'); dl.id=id; document.body.appendChild(dl); }
  dl.innerHTML=colChoices(key,tab).map(v=>`<option value="${esc(v)}">`).join('');
  return id;
}

function beginCellEdit(r,c,seed){
  const row=GRIDROWS[r], col=GRIDCOLS[c]; if(!row||!col)return;
  const f=colEditable(col);
  if(!f)return toast('This column is worked out, not typed');
  if(!canEdit())return toast('You have read-only access');
  const td=document.querySelector(`td[data-r="${r}"][data-c="${c}"]`); if(!td)return;
  const kind=f[2], cur=cellValue(row,col);
  let el;
  if(kind==='sel'){
    el=document.createElement('select');
    const opts=liveOptions(col.k,f[3],row);
    const maaden=projectClient(row&&row.project_id)==='Maaden';
    const show=o=>(maaden&&MAADEN_GRADE[o])?maadenLabel(o):o;
    el.innerHTML=opts.map(o=>
        `<option value="${esc(o)}"${String(o)===cur?' selected':''}>${esc(show(o))}</option>`).join('')+
      ((cur&&!opts.includes(cur))?`<option value="${esc(cur)}" selected>${esc(show(cur))}</option>`:'');
  }else if((kind==='text'||kind==='area')&&seed===undefined&&colChoices(col.k).length){
    /* a column whose values repeat gets a real dropdown, so every choice is
       visible — the browser's own suggestion list only shows what matches
       the text already in the box, which looked empty */
    const ch=colChoices(col.k), known=ch.includes(cur);
    el=document.createElement('select');
    el.innerHTML=`<option value=""${cur===''?' selected':''}>— none —</option>`+
      ch.map(o=>`<option${o===cur?' selected':''}>${esc(o)}</option>`).join('')+
      ((!known&&cur!=='')?`<option selected>${esc(cur)}</option>`:'')+
      `<option value="__new">＋ something else…</option>`;
    el.addEventListener('change',()=>{
      if(el.value!=='__new')return;
      const inp=document.createElement('input');
      inp.type='text'; inp.className='cellin'; inp.value='';
      inp.placeholder='Type the new value';
      el.replaceWith(inp); inp.focus();
      inp.addEventListener('blur',()=>finish(true));
      inp.addEventListener('keydown',ev=>{
        ev.stopPropagation();
        if(ev.key==='Enter'){ev.preventDefault();finish(true);}
        if(ev.key==='Escape'){ev.preventDefault();finish(false);}
      });
      el=inp;
    });
  }else{
    el=document.createElement('input');
    el.type = kind==='date'?'date' : kind==='num'?'number' : 'text';
    el.value = seed!==undefined?seed:cur;
  }
  el.className='cellin';
  td.innerHTML=''; td.appendChild(el); el.focus();
  if(el.select&&seed===undefined)el.select();
  let done=false;
  const finish=async commit=>{
    if(done)return; done=true;
    const v=el.value;
    if(commit && v!==cur){ await applyEdits([{row,col,f,val:v}],'Saved'); }
    else {
      /* nothing changed — put the cell back as it was, without redrawing the
         table, which used to replay the row animation every time */
      td.innerHTML = col.pill?pill(cur):esc(cur);
      paintSel();
    }
    const w=document.getElementById('gwrap'); if(w)w.focus();
  };
  el.addEventListener('blur',()=>finish(true));
  el.addEventListener('keydown',ev=>{
    ev.stopPropagation();
    if(ev.key==='Enter'){ev.preventDefault();finish(true).then(()=>{
      CUR={r:Math.min(r+1,GRIDROWS.length-1),c};SEL={r1:CUR.r,c1:c,r2:CUR.r,c2:c};paintSel();});}
    else if(ev.key==='Escape'){ev.preventDefault();finish(false);}
    else if(ev.key==='Tab'){ev.preventDefault();finish(true).then(()=>{
      CUR={r,c:Math.min(c+1,GRIDCOLS.length-1)};SEL={r1:r,c1:CUR.c,r2:r,c2:CUR.c};paintSel();});}
  });
}
/* ---- the keyboard ---- */
function gridKey(e){
  if(!GRIDROWS.length)return;
  const t=e.target;
  if(t&&(t.tagName==='INPUT'||t.tagName==='SELECT'||t.tagName==='TEXTAREA')&&!t.classList.contains('cellin'))return;
  const maxR=GRIDROWS.length-1, maxC=GRIDCOLS.length-1, k=e.key;
  const mv=(dr,dc,ext)=>{
    const r=Math.max(0,Math.min(maxR,CUR.r+dr)), c=Math.max(0,Math.min(maxC,CUR.c+dc));
    CUR={r,c};
    SEL = ext&&SEL ? {...SEL,r2:r,c2:c} : {r1:r,c1:c,r2:r,c2:c};
    paintSel();
  };
  if(k==='ArrowDown'){e.preventDefault();mv(1,0,e.shiftKey);}
  else if(k==='ArrowUp'){e.preventDefault();mv(-1,0,e.shiftKey);}
  else if(k==='ArrowLeft'){e.preventDefault();mv(0,-1,e.shiftKey);}
  else if(k==='ArrowRight'||k==='Tab'){e.preventDefault();mv(0,1,e.shiftKey&&k!=='Tab');}
  else if(k==='Enter'){e.preventDefault();beginCellEdit(CUR.r,CUR.c);}
  else if(k===' '){                       /* the space bar opens the record */
    e.preventDefault();
    const row=GRIDROWS[CUR.r]; if(row)openSheet(row.id);
  }
  else if(k==='Delete'||k==='Backspace'){e.preventDefault();clearSel();}
  else if((e.ctrlKey||e.metaKey)&&k.toLowerCase()==='c'){e.preventDefault();copySel();}
  else if((e.ctrlKey||e.metaKey)&&k.toLowerCase()==='d'){e.preventDefault();fillDown();}
  else if((e.ctrlKey||e.metaKey)&&k.toLowerCase()==='h'){e.preventDefault();findReplaceBox();}
  else if((e.ctrlKey||e.metaKey)&&k.toLowerCase()==='a'){e.preventDefault();
    SEL={r1:0,c1:0,r2:maxR,c2:maxC};CUR={r:0,c:0};paintSel();}
  else if(k.length===1&&k!==' '&&!e.ctrlKey&&!e.metaKey&&!e.altKey){
    e.preventDefault(); beginCellEdit(CUR.r,CUR.c,k);
  }
}
document.addEventListener('paste',e=>{

/* Hold a card for the things you would otherwise open the record to do. */
let _lp=null;
function wireCardHold(){
  document.querySelectorAll('.mcard[data-open]').forEach(el=>{
    const id=+el.dataset.open;
    const start=e=>{
      clearTimeout(_lp&&_lp.t);
      const x=e.touches?e.touches[0].clientX:e.clientX, y=e.touches?e.touches[0].clientY:e.clientY;
      _lp={x,y,fired:false,t:setTimeout(()=>{
        _lp.fired=true;
        shatter(el,()=>cardMenu(id));
      },480)};
    };
    const move=e=>{
      if(!_lp)return;
      const x=e.touches?e.touches[0].clientX:e.clientX, y=e.touches?e.touches[0].clientY:e.clientY;
      if(Math.abs(x-_lp.x)+Math.abs(y-_lp.y)>10){ clearTimeout(_lp.t); _lp=null; }
    };
    const end=()=>{ if(_lp)clearTimeout(_lp.t); };
    el.addEventListener('touchstart',start,{passive:true});
    el.addEventListener('touchmove',move,{passive:true});
    el.addEventListener('touchend',end);
    el.addEventListener('pointerdown',e=>{ if(e.pointerType!=='touch')start(e); });
    el.addEventListener('pointerup',end);
    el.addEventListener('contextmenu',e=>{ e.preventDefault(); cardMenu(id); });
    el.addEventListener('click',e=>{ if(_lp&&_lp.fired){ e.preventDefault(); e.stopPropagation();
      _lp=null; return; } openSheet(id); },true);
  });
}

/* ============================================================
   Breaking a card, with weight. The pieces are thrown, pulled down by
   gravity, tumble as they go, and come to rest on whatever card is
   beneath them — each one carrying a shadow that tightens as it lands.
   They stay where they fall until the screen is pressed.
   ============================================================ */
let SHARDS=null;
function clearShards(){
  if(!SHARDS)return;
  const {stage,card,raf}=SHARDS;
  cancelAnimationFrame(raf);
  stage.classList.add('gone');
  setTimeout(()=>stage.remove(),260);
  if(card){ card.classList.remove('cracked'); card.classList.add('remade');
    setTimeout(()=>card.classList.remove('remade'),280); }
  SHARDS=null;
}
function shatter(el,then){
  if(window.matchMedia('(prefers-reduced-motion:reduce)').matches){ if(then)then(); return; }
  clearShards();
  const r=el.getBoundingClientRect(), cs=getComputedStyle(el);
  const N=7;
  /* the shelves the pieces can land on: the top edge of every other card
     below this one, and the bottom of the screen */
  const shelves=[...document.querySelectorAll('.mkpi .kpi,.mcard,.dsec,.panel')]
    .filter(x=>x!==el)
    .map(x=>{const b=x.getBoundingClientRect(); return {top:b.top,left:b.left,right:b.right};})
    .filter(sh=>sh.top>r.top+r.height*0.3)
    .concat([{top:innerHeight-6,left:-1e4,right:1e4}])
    .sort((a,b)=>a.top-b.top);


  const stage=document.createElement('div');
  stage.className='shatter';
  document.body.appendChild(stage);

  const cx=34+Math.random()*32, cy=30+Math.random()*40;
  const rim=[];
  for(let i=0;i<N;i++){
    const a=(i/N)*Math.PI*2+(Math.random()-0.5)*0.5;
    rim.push([cx+Math.cos(a)*150, cy+Math.sin(a)*150]);
  }
  const pieces=[];
  for(let i=0;i<N;i++){
    const p1=rim[i], p2=rim[(i+1)%N];
    const d=document.createElement('div');
    d.className='shard';
    d.style.cssText=`left:${r.left}px;top:${r.top}px;width:${r.width}px;height:${r.height}px;`+
      `background:${cs.backgroundColor};border-radius:${cs.borderRadius};padding:${cs.padding};`;
    d.style.clipPath=`polygon(${cx}% ${cy}%, ${p1[0]}% ${p1[1]}%, ${p2[0]}% ${p2[1]}%)`;
    d.innerHTML=el.innerHTML;
    stage.appendChild(d);
    /* thrown away from the point of impact, with a little lift */
    const mx=((p1[0]+p2[0])/2-cx), my=((p1[1]+p2[1])/2-cy);
    const len=Math.hypot(mx,my)||1;
    pieces.push({el:d, x:0, y:0,
      vx:(mx/len)*(1.6+Math.random()*1.9),
      vy:(my/len)*1.1-(2.6+Math.random()*1.6),
      rot:0, vr:(Math.random()-0.5)*9,
      /* where this piece's own lowest corner sits, so it lands on its edge */
      foot:r.top+r.height*(Math.max(cy,p1[1],p2[1])/100),
      cxpx:r.left+r.width*((cx+p1[0]+p2[0])/300),
      rest:false, bounces:0});
  }

  const G=0.62, AIR=0.995, BOUNCE=0.36, FRICTION=0.72;
  let last=performance.now();
  const step=now=>{
    /* a negative or wild delta — a tab coming back, a clock that jumps —
       would flip gravity or fling the pieces off screen */
    const dt=Math.max(0.2,Math.min(2.2,(now-last)/16.67)); last=now;
    let moving=false;
    for(const p of pieces){
      if(!p.rest){
        moving=true;
        const footWas=p.foot+p.y;              /* where its lowest corner was */
        p.vy+=G*dt; p.vx*=AIR; p.x+=p.vx*dt; p.y+=p.vy*dt; p.rot+=p.vr*dt;
        const footNow=p.foot+p.y, xNow=p.cxpx+p.x;
        if(p.vy>0){
          /* a swept test: did the corner cross a shelf during this step? A
             fast piece moves further than any fixed window, so checking the
             line it travelled is the only way it cannot fall straight through */
          for(const sh of shelves){
            if(footWas<=sh.top && footNow>=sh.top
               && xNow>sh.left-40 && xNow<sh.right+40){
              p.y-=(footNow-sh.top);
              if(Math.abs(p.vy)>2.2 && p.bounces<2){
                p.vy=-Math.abs(p.vy)*BOUNCE; p.vx*=FRICTION; p.vr*=FRICTION; p.bounces++;
              }else{
                p.vy=0; p.vx=0; p.vr=0; p.rest=true;
                p.el.classList.add('landed');
              }
              break;
            }
          }
        }
      }
      /* the shadow tightens as the piece nears what it will land on */
      const h=Math.max(0,Math.min(1,(p.vy>0?p.vy:0)/12));
      p.el.style.transform=`translate(${p.x.toFixed(1)}px,${p.y.toFixed(1)}px) rotate(${p.rot.toFixed(1)}deg)`;
      p.el.style.filter=`drop-shadow(0 ${(4+h*14).toFixed(1)}px ${(6+h*16).toFixed(1)}px rgba(0,0,0,${(0.5-h*0.22).toFixed(2)}))`;
    }
    if(moving)SHARDS.raf=requestAnimationFrame(step);
  };
  el.classList.add('cracked');
  if(navigator.vibrate)navigator.vibrate([9,28,14]);
  SHARDS={stage,card:el,raf:requestAnimationFrame(step)};
  /* they stay put; the next press anywhere puts the card back together */
  setTimeout(()=>{
    document.addEventListener('pointerdown',clearShards,{once:true});
    document.addEventListener('touchstart',clearShards,{once:true});
  },80);
  if(then)then();
}

function wireOverviewHold(){
  document.querySelectorAll('.mkpi .kpi[data-rstate]').forEach(card=>{
    if(card._hold)return; card._hold=1;
    let t=null, fired=false, sx=0, sy=0;
    const go=()=>{ fired=true; shatter(card); };   /* break it, and leave it broken */
    const start=e=>{
      const p=e.touches?e.touches[0]:e;
      sx=p.clientX; sy=p.clientY; fired=false;
      clearTimeout(t); t=setTimeout(go,420);
    };
    const move=e=>{
      const p=e.touches?e.touches[0]:e;
      if(Math.abs(p.clientX-sx)+Math.abs(p.clientY-sy)>10)clearTimeout(t);
    };
    const stop=()=>clearTimeout(t);
    card.addEventListener('touchstart',start,{passive:true});
    card.addEventListener('touchmove',move,{passive:true});
    card.addEventListener('touchend',stop);
    card.addEventListener('touchcancel',stop);
    card.addEventListener('pointerdown',e=>{ if(e.pointerType!=='touch')start(e); });
    card.addEventListener('pointerup',stop);
    card.addEventListener('pointerleave',stop);
    /* a plain tap still filters at once; the hold has already done it */
    card.addEventListener('click',e=>{ if(fired){ e.preventDefault(); e.stopPropagation(); fired=false; } },true);
  });
}

    const i=+b.dataset.a; if(i>=0)acts[i][1](); close(); });

function cardsHTML(rows,cols){

    const ref=r.doc_no||r.submittal_no||'';

    const dates=[
      r.planned_date?['Planned',dayShort(r.planned_date)]:null,

}

     :TAB==='shop'?sdFor().length:TAB==='invoice'?invFor().length:abFor().length);

    const none = TAB==='asbuilts' && AB.length===0;
    $wrap().innerHTML=`<div class="empty"><div class="big">${none?'📥':'🔍'}</div>

            :'Try a different search or filter.'}</div>`;

  const vcols=shownCols(cols);          /* cols is a const — work on a copy */

  const fcls=i=>i<fz?(' frz'+(i===fz-1?' frzlast':'')):'';

      <th class="pickcol"><input type="checkbox" id="pickall" title="Tick every row shown"

        title="Right-click, or shift-click, for column options"><span class="cgrip" data-g="${c.k}"></span>${c.t}${
        (CFILT[c.k]&&CFILT[c.k].length)?' <i class="fmark">▼</i>':''}${
        SORT.k===c.k?(SORT.dir>0?' ▲':' ▼'):''}</th>`).join('')}</tr></thead>
    <tbody>${rows.map((r,ri)=>`<tr data-id="${r.id}" data-row="${ri}"
      class="${PICKED.has(r.id)?'picked':''}"${ANIMATE?` style="animation-delay:${Math.min(ri,16)*22}ms"`:''}>
      <td class="pickcol"><input type="checkbox" class="rowpick" data-pick="${r.id}"
        ${PICKED.has(r.id)?'checked':''}></td>
      <td class="opencol"><button class="openb" data-open="${r.id}"
        title="Open this record — or press the space bar">▸</button></td>${
      vcols.map((c,ci)=>{
        const v=c.calc?c.calc(r):r[c.k];
        const txt=(v===null||v===undefined||v==='')?'':String(v);
        return `<td data-r="${ri}" data-c="${ci}" class="${c.cls||''} ${c.wrap?'wrapc':''}${fcls(ci)}"
          style="${fsty(ci)}">${c.pill?pill(txt,r):esc(txt)}</td>`;}).join('')}</tr>`).join('')}
    </tbody></table></div>`;
  $wrap().querySelectorAll('tbody tr[data-id]').forEach(tr=>
    tr.ondblclick=e=>{ if(!e.target.closest('td[data-r]'))openSheet(+tr.dataset.id); });
  wireCells(); wireColResize(); wireColDrag(); wirePicks(rows);
  $wrap().querySelectorAll('th[data-k]').forEach(th=>{

      const k=th.dataset.k;

/* ============================================================
   The dashboard's opening panel: a ring showing how far the register
   has got, the figures beside it, and the week's movement. Everything
   here is clickable and lands in the register.
   ============================================================ */
function donut(pct,label,sub,colour){
  const R=52, C=2*Math.PI*R, on=Math.max(0,Math.min(100,pct));
  return `<div class="ring">
    <svg viewBox="0 0 130 130">
      <circle cx="65" cy="65" r="${R}" class="rbg"></circle>
      <circle cx="65" cy="65" r="${R}" class="rfg"
        style="stroke:${colour||'var(--accent)'};stroke-dasharray:${C};
               stroke-dashoffset:${C-(C*on/100)}"></circle>
    </svg>
    <div class="rmid"><b>${Math.round(on)}<small>%</small></b><span>${esc(label)}</span></div>
    ${sub?`<div class="rsub2">${esc(sub)}</div>`:''}</div>`;
}

    return {out:src.filter(r=>(r.submitted_date||'')>=cut).length,

  })();
  const late=(typeof overdueRows==='function')?overdueRows().length:0;
  return `<div class="panel hero">
    <div class="heroL">
      ${donut(doneRow.p,doneRow.t||'done',doneRow.n+' of '+total,'var(--good)')}
    </div>
    <div class="heroR">
      <div class="hhead"><h3>${esc(label)}</h3>
        <span class="hsub">${PROJ?esc(projName(PROJ)):'all projects'} · ${total} record${total===1?'':'s'}</span></div>
      <div class="hstats">

function bars(title,groups,colFor,drill){
  if(!groups.length)return '';            /* nothing to show, so show nothing */
  const max=Math.max(1,...groups.map(g=>g.total));
  /* long lists are cut to the biggest few, with a line saying what is left */
  const CAP=7, rest=groups.length>CAP?groups.slice(CAP):[];
  if(rest.length)groups=groups.slice(0,CAP);
  const at=(g,state)=>drill
    ? ` data-drill="${esc(drill.tab)}|${esc(drill.field)}|${esc(String(g.raw))}|${state}|${esc(g.k)}"`
    : '';
  return `<div class="panel${drill?' live':''}"><h3>${title}${
      drill?'<span class="hintclick">click to filter</span>':''}</h3>${groups.map(g=>`
    <div class="brow"><div class="blab" title="${esc(g.k)}"${at(g,'all')}>${esc(g.k)}</div>
      <div class="btrack" style="width:${g.total/max*100}%">
        <i style="flex:${g.done};background:var(--good)"${at(g,'done')} title="${g.done} done"></i>
        <i style="flex:${g.total-g.done};background:${colFor||'var(--hot)'}"${at(g,'open')}
           title="${g.total-g.done} outstanding"></i></div>
      <div class="bnum"${at(g,'all')}><b>${g.done}</b>/${g.total}</div></div>`).join('')}
    ${rest.length?`<div class="bmore">and ${rest.length} more · ${
        rest.reduce((t,g)=>t+g.done,0)}/${rest.reduce((t,g)=>t+g.total,0)}</div>`:''}
    <div class="legend"><span><i style="background:var(--good)"></i>done</span>
      <span><i style="background:${colFor||'var(--hot)'}"></i>outstanding</span>
      <span style="margin-left:auto;text-transform:none;letter-spacing:0">done / total</span>
      </div></div>`;
}
function group(rows,keyFn,doneFn,rawFn){
  const m={};
  rows.forEach(r=>{const k=keyFn(r)||'(not set)';
    (m[k]=m[k]||{k,total:0,done:0,raw:rawFn?rawFn(r):(keyFn(r)||'')});
    m[k].total++;if(doneFn(r))m[k].done++;});
  return Object.values(m).sort((a,b)=>(b.total-b.done)-(a.total-a.done)||b.total-a.total);
}

/* ============================================================
   The LOD tracker's card set: every record in the register sits in
   exactly one state, the cards add to the total and the bar beneath
   adds to 100%. Clicking a card filters the register to that state.
   ============================================================ */
function regSplit(tab){
  const rows=rowsOf(tab);
  const st=[];
  if(tab==='asbuilts'||tab==='gis'){
    const done=r=>tab==='asbuilts'?AB_DONE(r.status):GIS_OK(r.review_status);
    st.push({k:'done', t:'Approved',      c:'var(--good)',  s:'signed off, nothing outstanding',
             f:r=>done(r)});
    st.push({k:'sent', t:'Awaiting reply',c:'var(--warn)',  s:'submitted, no answer yet',
             f:r=>!done(r)&&r.submitted_date});
    st.push({k:'none', t:'Not submitted', c:'var(--ink3)',  s:'no submission at all',
             f:r=>!done(r)&&!r.submitted_date});
  } else if(tab==='shop' && !isMaaden()){
    /* NWC's own words */
    st.push({k:'ok',   t:'Approved',      c:'var(--good)',  s:'approved by the reviewer',
             f:r=>GIS_OK(r.review_status)});
    st.push({k:'rev',  t:'To revise',     c:'var(--serious)',s:'returned with comments',
             f:r=>/revise|reject/i.test(r.review_status||'')});
    st.push({k:'under',t:'Under review',  c:'var(--warn)',  s:'submitted, awaiting the reviewer',
             f:r=>!GIS_OK(r.review_status)&&r.submitted_date});
    st.push({k:'none', t:'Not submitted', c:'var(--ink3)',  s:'no submission at all',
             f:r=>true});
  } else if(tab==='shop'){
    st.push({k:'a',    t:'A — accepted',  c:'#0f9d58',
             s:"Code A, Deemed accepted", f:r=>/^(Code A|Deemed|Approved)$/.test(r.review_status||'')});
    st.push({k:'c',    t:'C — with exceptions', c:'#6fc38a',
             s:'proceed with exceptions', f:r=>/^(Code B|Approved As Noted)$/.test(r.review_status||'')});
    st.push({k:'i',    t:'I — for information', c:'var(--sky)',
             s:'issued for information', f:r=>/^(Replied|For Information)$/.test(r.review_status||'')});
    st.push({k:'r',    t:'R — do not proceed', c:'#d64545',
             s:'revise and resubmit', f:r=>/^(Rejected|Revise & Resubmit)$/.test(r.review_status||'')});
    st.push({k:'hold', t:'On hold',       c:'#7030a0', s:'held pending a prerequisite',
             f:r=>/^(On hold|Pending NWC)$/.test(r.review_status||'')});
    st.push({k:'under',t:'With the Client',c:'var(--warn)', s:'submitted, awaiting their stamp',
             f:r=>r.submitted_date&&!/^(Not Submitted|Withdrawn)$/.test(r.review_status||'')});
    st.push({k:'none', t:'Not submitted', c:'var(--ink3)', s:'no submission at all',
             f:r=>true});
  } else {
    st.push({k:'inv',  t:'Invoiced',      c:'var(--good)',  s:'carries an invoice number',
             f:r=>String(r.invoice_no||'').trim()&&String(r.invoice_no)!=='0'});
    st.push({k:'sub',  t:'Submitted',     c:'var(--warn)',  s:'submitted, not yet invoiced',
             f:r=>!(String(r.invoice_no||'').trim()&&String(r.invoice_no)!=='0')
                  &&String(r.status||'').trim().toLowerCase()==='submitted'});
    /* whatever is left — the states are tried in order, so this catches the rest */
    st.push({k:'none', t:'Not submitted', c:'var(--ink3)',  s:'still to go', f:r=>true});
  }
  /* each record falls in the FIRST state it matches, so nothing is counted twice */
  const seen=new Set(), out=st.map(x=>({...x,n:0}));
  rows.forEach(r=>{
    for(const x of out){ if(!seen.has(r.id)&&x.f(r)){ x.n++; seen.add(r.id); break; } }
  });
  const total=rows.length;
  /* largest remainder, so the percentages add to exactly 100 */
  let acc=0;
  out.forEach((x,i)=>{ x.p = total? (i===out.length-1 ? 100-acc : Math.round(x.n/total*100)) : 0;
    if(i<out.length-1)acc+=x.p; });
  if(!total)out.forEach(x=>x.p=0);
  return {rows:out,total};
}
function regCards(tab){
  const {rows,total}=regSplit(tab);
  const tiles=rows.map(x=>`<div class="kpi regkpi" data-rstate="${esc(x.k)}">
      <div class="k">${esc(x.t)}</div><div class="v">${x.n}<small>${x.p}%</small></div>
      <div class="p">${esc(x.s)}</div>
      <div class="bar"><i style="width:${x.p}%;background:${x.c}"></i></div></div>`).join('');
  const bar=`<div class="ballbar regbar100">${rows.filter(x=>x.n).map(x=>
      `<i data-rstate="${esc(x.k)}" title="${esc(x.t)} — ${x.n}"
          style="width:${x.n/(total||1)*100}%;background:${x.c}"><b>${x.n}</b></i>`).join('')}</div>`;
  const sum=rows.reduce((t,x)=>t+x.n,0), psum=rows.reduce((t,x)=>t+x.p,0);
  const label=(TABS.find(t=>t.k===tab)||{}).t||'';
  return `<div class="panel"><h3>Where the ${total} ${esc(label.toLowerCase())} stand</h3>
    <div class="kpis">${tiles}</div>${bar}
    <div class="legtot"><b>${sum} of ${total}</b> records · <b>${psum}%</b> —
      every record is in exactly one of these states${
        sum===total&&psum===100?'':' <span class="bad">(does not close)</span>'}</div></div>`;
}

/* drag a heading sideways to put the column somewhere else */
function wireColDrag(){
  const ths=[...document.querySelectorAll('table.g th[data-k]')];
  ths.forEach(th=>{
    th.setAttribute('draggable','true');
    th.addEventListener('dragstart',e=>{
      if(e.target.closest('.cgrip')){ e.preventDefault(); return; }
      e.dataTransfer.setData('text/plain',th.dataset.k);
      e.dataTransfer.effectAllowed='move';
      th.classList.add('dragging');
    });
    th.addEventListener('dragend',()=>{
      th.classList.remove('dragging');
      ths.forEach(x=>x.classList.remove('dropL','dropR'));
    });
    th.addEventListener('dragover',e=>{
      e.preventDefault();
      const b=th.getBoundingClientRect();
      const before=(e.clientX-b.left)<b.width/2;
      th.classList.toggle('dropL',before);
      th.classList.toggle('dropR',!before);
    });
    th.addEventListener('dragleave',()=>th.classList.remove('dropL','dropR'));
    th.addEventListener('drop',e=>{
      e.preventDefault();
      const from=e.dataTransfer.getData('text/plain'), to=th.dataset.k;
      th.classList.remove('dropL','dropR');
      if(!from||from===to)return;
      const b=th.getBoundingClientRect();
      const before=(e.clientX-b.left)<b.width/2;
      const order=(COLPREF.order&&COLPREF.order.length)
        ? COLPREF.order.slice() : GRIDCOLS.map(c=>c.k);
      const i=order.indexOf(from); if(i>=0)order.splice(i,1);
      let j=order.indexOf(to); if(j<0)j=order.length;
      order.splice(before?j:j+1,0,from);
      COLPREF.order=order; saveColPref(); paintTable();
      toast('Column moved');
    });
  });
}

function wireColResize(){
  document.querySelectorAll('table.g th .cgrip').forEach(g=>{
    const k=g.dataset.g;
    g.addEventListener('pointerdown',e=>{
      e.preventDefault(); e.stopPropagation();
      const th=g.closest('th'), x0=e.clientX, w0=th.getBoundingClientRect().width;
      const move=ev=>{
        const w=Math.max(56,Math.round(w0+(ev.clientX-x0)));
        COLPREF.w[k]=w; th.style.width=w+'px';
        th.style.minWidth=w+'px'; th.style.maxWidth=w+'px';
      };
      const up=()=>{ document.removeEventListener('pointermove',move);
        saveColPref(); paintTable(); };
      document.addEventListener('pointermove',move);
      document.addEventListener('pointerup',up,{once:true});
    });

      e.preventDefault(); e.stopPropagation();
      const col=GRIDCOLS.find(c=>c.k===k); if(!col)return;
      let max=String(col.t).length;

      COLPREF.w[k]=Math.max(60,Math.min(460, 14+max*7.2));
      saveColPref(); paintTable();
    });
  });
}

let FRSTATE={find:'',repl:'',col:'',caseOn:false,whole:false,selOnly:false};
function findReplaceBox(){

     </div>

     <div id="frlist" style="max-height:190px;overflow:auto;margin-top:6px"></div>`,
    [['Cancel',null,''],['Replace them',async()=>{
       const jobs=frMatches().jobs;
       if(!jobs.length)return toast('Nothing matched');
       await applyEdits(jobs,'Replaced');
     },'primary']]);
  const m=document.getElementById('msg');
  const read=()=>{
    FRSTATE={find:m.querySelector('#frf').value, repl:m.querySelector('#frr').value,
      col:m.querySelector('#frc').value, caseOn:m.querySelector('#frcase').checked,
      whole:m.querySelector('#frwhole').checked,
      selOnly:!!(m.querySelector('#frsel')&&m.querySelector('#frsel').checked)};
  };
  const preview=()=>{
    read();
    const {jobs,rows}=frMatches();
    m.querySelector('#frcount').innerHTML = !FRSTATE.find ? 'Type something to find.'
      : jobs.length ? `<b>${jobs.length}</b> cell${jobs.length>1?'s':''} in <b>${rows}</b> record${rows>1?'s':''} will change.`
      : 'Nothing matches.';
    m.querySelector('#frlist').innerHTML = jobs.slice(0,12).map(j=>
      `<div class="frrow"><span class="frc">${esc(j.col.t)}</span>

      + (jobs.length>12?`<div class="hint">…and ${jobs.length-12} more</div>`:'');
  };
  ['#frf','#frr','#frc','#frcase','#frwhole','#frsel'].forEach(sel=>{
    const el=m.querySelector(sel); if(el){ el.oninput=preview; el.onchange=preview; }
  });
  m.querySelector('#frf').focus();
  preview();
}
/* every change find-and-replace would make, without making any of them */
function frMatches(){
  const out=[]; const seen=new Set();
  if(!FRSTATE.find)return {jobs:out,rows:0};
  const b=FRSTATE.selOnly?selBox():null;
  const cols=GRIDCOLS.filter(c=>colEditable(c) && (!FRSTATE.col||c.k===FRSTATE.col));
  const needle=FRSTATE.caseOn?FRSTATE.find:FRSTATE.find.toLowerCase();
  GRIDROWS.forEach((row,ri)=>{
    if(b&&(ri<b.r1||ri>b.r2))return;
    cols.forEach(col=>{
      const ci=GRIDCOLS.indexOf(col);
      if(b&&(ci<b.c1||ci>b.c2))return;
      const was=cellValue(row,col);
      const hay=FRSTATE.caseOn?was:was.toLowerCase();
      let val=null;
      if(FRSTATE.whole){ if(hay===needle)val=FRSTATE.repl; }
      else if(needle && hay.includes(needle)){
        /* replace every occurrence, keeping the original casing elsewhere */
        val=''; let i=0;
        while(true){
          const at=hay.indexOf(needle,i);
          if(at<0){ val+=was.slice(i); break; }
          val+=was.slice(i,at)+FRSTATE.repl;
          i=at+needle.length;
        }
      }
      if(val===null||val===was)return;
      out.push({row,col,f:colEditable(col),val,was});
      seen.add(row.id);
    });
  });
  return {jobs:out,rows:seen.size};
}

function wireCells(){
  const w=document.getElementById('gwrap'); if(!w)return;
  /* A plain click must pick ONE cell and stop. Dragging only begins once the
     pointer has actually moved, and the listener that ends it is attached and
     removed on every drag — the earlier version registered it once, so after
     the first click the grid never stopped selecting. */
  let drag=null;
  const stop=()=>{ drag=null;
    document.removeEventListener('pointermove',onMove);
    document.removeEventListener('pointerup',stop);
    document.removeEventListener('pointercancel',stop); };
  const onMove=e=>{
    if(!drag)return;
    if(!drag.live){
      if(Math.abs(e.clientX-drag.x)+Math.abs(e.clientY-drag.y)<6)return;   /* a click, not a drag */
      drag.live=true;
    }
    const td=document.elementFromPoint(e.clientX,e.clientY);
    const cell=td&&td.closest&&td.closest('td[data-r]');
    if(!cell)return;
    SEL={...SEL,r2:+cell.dataset.r,c2:+cell.dataset.c};
    CUR={r:+cell.dataset.r,c:+cell.dataset.c};
    paintSel();
  };
  w.querySelectorAll('td[data-r]').forEach(td=>{
    const r=+td.dataset.r, c=+td.dataset.c;
    td.addEventListener('pointerdown',e=>{
      if(e.button!==0)return;
      if(e.target.closest('.rowpick')||e.target.closest('.openb'))return;
      if(e.target.classList&&e.target.classList.contains('cellin'))return;
      e.preventDefault();      /* the cell is selected, not the words inside it */
      w.focus();
      if(e.shiftKey&&SEL){ SEL={...SEL,r2:r,c2:c}; CUR={r,c}; }
      else { CUR={r,c}; SEL={r1:r,c1:c,r2:r,c2:c}; }
      paintSel();
      drag={x:e.clientX,y:e.clientY,live:false};
      document.addEventListener('pointermove',onMove);
      document.addEventListener('pointerup',stop);
      document.addEventListener('pointercancel',stop);
    });
    td.addEventListener('dblclick',e=>{ e.stopPropagation(); beginCellEdit(r,c); });
  });
  w.querySelectorAll('.openb').forEach(b=>{
    b.onpointerdown=e=>e.stopPropagation();
    b.onclick=e=>{ e.stopPropagation(); openSheet(+b.dataset.open); };
  });
  w.onkeydown=gridKey;
  paintSel();
}

/* The invoice register measures work in metres, not documents, so its panels
   count length as well as sections. */
function invSections(states){
  const src=rowsOf('invoice');
  if(!src.length)return '';
  if(!src.some(r=>Number(r.length_m)>0))return '';   /* nothing measured, nothing to show */
  const m=r=>Number(r.length_m)||0;
  const isDone=r=>String(r.invoice_no||'').trim()!=='' ||
                  String(r.status||'').trim().toLowerCase()==='submitted';
  const done=src.filter(isDone);
  const tot=src.reduce((t,r)=>t+m(r),0), got=done.reduce((t,r)=>t+m(r),0);
  const km=v=>(v/1000).toFixed(1)+' km';
  const byGroup=(field,title,fmt)=>{
    const keys=[...new Set(src.map(r=>String(r[field]||'(not set)')))]
      .map(k=>{ const rows=src.filter(r=>String(r[field]||'(not set)')===k);
        return {k,n:rows.length,len:rows.reduce((t,r)=>t+m(r),0),
                dn:rows.filter(isDone).length}; })
      .sort((a,b)=>b.len-a.len);
    if(keys.length<2)return '';
    const max=keys[0].len||1;
    return `<div class="dsec"><div class="dhead"><h3>${esc(title)}</h3>
        <span>${keys.length} groups · ${km(tot)} in total</span></div>
      ${keys.slice(0,12).map(g=>`<div class="drow">
        <div class="dlab" title="${esc(g.k)}">${esc(fmt?fmt(g.k):g.k)}</div>
        <div class="dtrack" style="width:${g.len/max*100}%">
          <i style="flex:${g.dn};background:var(--good)"></i>
          <i style="flex:${g.n-g.dn};background:var(--warn)"></i></div>
        <div class="dn">${km(g.len)}</div>
        <div class="dp">${g.dn}/${g.n}</div></div>`).join('')}
      ${keys.length>12?`<div class="dmore">and ${keys.length-12} more</div>`:''}
      <div class="dchips">
        <span class="dchip" data-rstate="inv"><i style="background:var(--good)"></i>
          Invoiced <b>${src.filter(isDone).length}</b></span>
        <span class="dchip" data-rstate="none"><i style="background:var(--warn)"></i>
          Still to invoice <b>${src.length-src.filter(isDone).length}</b></span></div></div>`;
  };
  return `<div class="dsec">
      <div class="dhead"><h3>Length invoiced</h3>
        <span>${done.length} of ${src.length} sections</span></div>
      <div class="dbar">
        <i style="width:${tot?got/tot*100:0}%;background:var(--good)"><b>${km(got)}</b></i>
        <i style="width:${tot?(tot-got)/tot*100:0}%;background:var(--warn)"><b>${km(tot-got)}</b></i>
      </div>
      <div class="dnote">${km(got)} of ${km(tot)} — ${Math.round(tot?got/tot*100:0)}% of the network</div>
      <div class="dchips">
        <span class="dchip" data-rstate="inv"><i style="background:var(--good)"></i>
          Invoiced <b>${done.length}</b></span>
        <span class="dchip" data-rstate="none"><i style="background:var(--warn)"></i>
          Still to invoice <b>${src.length-done.length}</b></span></div>
    </div>`
    + byGroup('diameter_mm','By diameter',k=>k==='(not set)'?k:('Ø'+k+' mm'))
    + byGroup('method','By method');
}


/* The Overview a phone shows: the same figures as the desktop, as blocks. */
function mobOverview(){
  /* One card per state, so the percentages add to exactly 100 — the cards are
     a division of the register, not a set of separate measures. */
  const {rows:states,total}=regSplit(TAB);
  const label=(TABS.find(t=>t.k===TAB)||{}).t||'';
  const src=rowsOf(TAB);
  const late=src.filter(r=>r.planned_date&&r.planned_date<today&&!r.submitted_date).length;
  const shown=states.filter(x=>x.n);                 /* nothing empty is drawn */
  const sum=shown.reduce((t,x)=>t+x.n,0);
  const psum=shown.reduce((t,x)=>t+x.p,0);
  return `<div class="mkpi">
      ${shown.map(x=>`<div class="kpi" data-rstate="${esc(x.k)}">
          <div class="k">${esc(x.t)}</div>
          <div class="v">${x.n}<small>${x.p}%</small></div>
          <div class="p">${esc(x.s)}</div>
          <div class="bar"><i style="width:${Math.max(2,x.p)}%;background:${x.c}"></i></div>
        </div>`).join('')}
    </div>
    <div class="dsec">
      <div class="dbar">${shown.map(x=>
        `<i data-rstate="${esc(x.k)}" style="width:${x.n/(total||1)*100}%;background:${x.c}"
            title="${esc(x.t)} — ${x.n}"><b>${x.n}</b></i>`).join('')}</div>
      <div class="dnote"><b>${sum} of ${total}</b> ${esc(String(label).toLowerCase())} ·
        <b>${psum}%</b> — every record is in exactly one of these${
        (sum===total&&psum===100)?'':' <span class="bad">(does not close)</span>'}</div>
    </div>
    ${late?`<div class="dsec late"><div class="dhead"><h3>Overdue</h3></div>
      <div class="bignum">${late}</div>
      <div class="dnote">past the planned date and not yet sent</div></div>`:''}`;
}



/* ===== THE LOUPE ========================================================
   A one-record slice of a stacked bar is about two pixels wide on a phone.
   Tapping it is luck, and the tap that lands opens the wrong filter — which
   is worse than no tap at all. So a press on any bar lifts its segments out
   into a strip above the finger, each one wide enough to hit and labelled
   with its state and count. Slide to move between them, lift to apply the
   same filter a tap would have applied, slide off to cancel. A quick tap
   still behaves exactly as it did. */
let LOUPE=null;
function loupeEl(){
  if(LOUPE&&document.body.contains(LOUPE))return LOUPE;
  LOUPE=document.createElement('div');
  LOUPE.id='loupe'; LOUPE.setAttribute('aria-hidden','true');
  document.body.appendChild(LOUPE);
  return LOUPE;
}
function hideLoupe(){ if(LOUPE)LOUPE.classList.remove('on'); }
function attachLoupe(){
  if(!isPhone())return;
  document.querySelectorAll('.dbar,.dtrack,.hbar').forEach(bar=>{
    if(bar._loupe)return; bar._loupe=1;
    const segs=[...bar.querySelectorAll('i[data-rstate]')];
    if(segs.length<2)return;               /* one block is already easy to hit */
    bar.style.touchAction='none';
    let live=false, pick=-1, blocks=[];
    const info=sg=>{
      const label=(sg.getAttribute('title')||'').trim();
      const cut=label.lastIndexOf(' — ');
      return {name:cut>0?label.slice(0,cut):label,
              n:cut>0?label.slice(cut+3):(sg.textContent||'').trim(),
              col:sg.style.background||sg.style.backgroundColor};
    };
    const open=y=>{
      const el=loupeEl();
      el.innerHTML=`<div class="lptitle">Pick a colour</div>
        <div class="lprow">${segs.map((sg,i)=>{const d=info(sg);
          return `<div class="lpseg" data-i="${i}" style="flex:${Math.max(1,parseInt(d.n)||1)}">
            <i style="background:${d.col}"></i>
            <b>${esc(d.n)}</b><span>${esc(d.name)}</span></div>`;}).join('')}</div>
        <div class="lphint">Slide to choose · lift to filter</div>`;
      el.classList.add('on');
      const r=el.getBoundingClientRect();
      el.style.top=Math.max(8,y-r.height-18)+'px';
      blocks=[...el.querySelectorAll('.lpseg')];
      live=true; pick=-1;
    };
    const at=x=>{
      for(let i=0;i<blocks.length;i++){
        const b=blocks[i].getBoundingClientRect();
        if(x>=b.left&&x<=b.right)return i;
      }
      return -1;
    };
    const mark=i=>{
      if(i===pick)return; pick=i;
      blocks.forEach((b,j)=>b.classList.toggle('on',j===i));
    };
    bar.addEventListener('touchstart',e=>{
      const t=e.touches[0]; if(!t)return;
      open(bar.getBoundingClientRect().top);
      let i=-1;
      segs.forEach((sg,j)=>{const b=sg.getBoundingClientRect();
        if(t.clientX>=b.left&&t.clientX<=b.right)i=j;});
      mark(i>=0?i:at(t.clientX));
    },{passive:true});
    bar.addEventListener('touchmove',e=>{
      if(!live)return;
      const t=e.touches[0]; if(!t)return;
      e.preventDefault();                  /* the page must not scroll under it */
      mark(at(t.clientX));
    },{passive:false});
    const end=apply=>{
      if(!live)return; live=false;
      const i=pick; hideLoupe();
      if(apply&&i>=0&&segs[i])segs[i].click();
    };
    bar.addEventListener('touchend',()=>end(true));
    bar.addEventListener('touchcancel',()=>end(false));
  });
}

function paintOverview(){
  /* The LOD's shape: a few full-width sections, each one saying a whole
     thing, rather than a grid of small panels. */
  const {rows:states,total}=regSplit(TAB);
  const label=(TABS.find(t=>t.k===TAB)||{}).t||'';
  const src=rowsOf(TAB);
  if(isPhone()&&total){ $wrap().innerHTML=mobOverview(); wireRegCards();
    attachLoupe(); wireOverviewHold(); return; }
  if(isPhone()&&!total){
    $wrap().innerHTML=`<div class="dsec"><div class="dhead"><h3>${esc(label)}</h3></div>
      <div class="hint">Nothing in this register${PROJ?' for '+esc(projName(PROJ)):''} yet.</div></div>`;
    return;
  }
  if(!total){
    $wrap().innerHTML=`<div class="dsec"><div class="dhead"><h3>${esc(label)}</h3></div>
      <div class="hint">Nothing in this register${PROJ?' for '+esc(projName(PROJ)):''} yet.</div></div>`;
    return;
  }

  /* 1. what needs acting on — planned, past its date, still not sent */
  const late=src.filter(r=>r.planned_date && r.planned_date<today &&
      !(r.submitted_date&&r.submitted_date>=r.planned_date) &&
      !GIS_OK(r.review_status))
    .sort((a,b)=>(a.planned_date||'').localeCompare(b.planned_date||''));
  const days=d=>Math.max(0,Math.round((new Date(today)-new Date(d))/864e5));
  const lateSec = late.length ? `<div class="dsec">
      <div class="dhead"><h3>Needs action</h3>
        <span>${late.length} past the planned date and not yet sent</span></div>
      <table class="dtbl"><thead><tr><th>Document</th><th>Planned</th>
        <th class="n">Days late</th><th>With</th><th>Status</th></tr></thead>
      <tbody>${late.slice(0,12).map(r=>`<tr data-open="${r.id}">
        <td>${esc(r.description||r.doc_no||'—')}</td>
        <td>${esc(dayShort(r.planned_date))}</td>
        <td class="n late">${days(r.planned_date)}</td>
        <td>${esc(r.action_by||'—')}</td>
        <td>${esc(r.review_status||'—')}</td></tr>`).join('')}</tbody></table>
      ${late.length>12?`<div class="dmore">and ${late.length-12} more</div>`:''}
    </div>` : '';

  /* 2. where everything stands — one bar, and a chip per state */
  const stand = `<div class="dsec">
      <div class="dhead"><h3>Where the ${total} ${esc(String(label).toLowerCase())} stand</h3>
        <span>${PROJ?esc(projName(PROJ)):'all projects'}</span></div>
      <div class="dbar">${states.filter(x=>x.n).map(x=>
        `<i data-rstate="${esc(x.k)}" title="${esc(x.t)} — ${x.n}"
            style="width:${x.n/(total||1)*100}%;background:${x.c}"><b>${x.n}</b></i>`).join('')}</div>
      <div class="dchips">${states.map(x=>
        `<span class="dchip" data-rstate="${esc(x.k)}"><i style="background:${x.c}"></i>
          ${esc(x.t)} <b>${x.n}</b></span>`).join('')}</div>
      <div class="dnote">Every record sits in exactly one of these. ${
        states.reduce((t,x)=>t+x.n,0)} of ${total}.</div>
    </div>`;

  /* 3. the same split, by discipline — the LOD's "by discipline" section */
  const discSec = discSection('discipline','By discipline',states);
  const zoneSec = discSection('zone','By zone',states);

  /* a panel with nothing to say is left out, and the invoice register gets
     the ones that suit it */
  const daily = (typeof dailyPanel==='function' && rowsOf(TAB).some(r=>r.submitted_date||r.received_date))
    ? dailyPanel() : '';
  const extra = TAB==='invoice' ? invSections(states) : (discSec + zoneSec);
  $wrap().innerHTML = stand + lateSec + extra + daily;
}
/* one row per value, split by the same states, so the totals agree with the
   bar above */
function dayShort(d){
  if(!d)return '—';
  const x=new Date(d+'T00:00:00');
  return isNaN(x)?String(d):x.toLocaleDateString('en-GB',{day:'2-digit',month:'short'});
}
function discSection(field,title,states){
  const src=rowsOf(TAB);
  const keys=[...new Set(src.map(r=>String(r[field]||'(not set)')))]
    .map(k=>({k,n:src.filter(r=>String(r[field]||'(not set)')===k).length}))
    .sort((a,b)=>b.n-a.n);
  if(keys.length<2)return '';
  const max=keys[0].n;
  const seen=new Set();
  const stateOf=r=>{ for(const st of states){ if(st.f(r))return st; } return states[states.length-1]; };
  return `<div class="dsec">
    <div class="dhead"><h3>${esc(title)}</h3><span>${keys.length} groups</span></div>
    ${keys.slice(0,12).map(g=>{
      const rows=src.filter(r=>String(r[field]||'(not set)')===g.k);
      const parts=states.map(st=>({st,v:rows.filter(r=>stateOf(r)===st).length})).filter(p=>p.v);
      const done=rows.filter(r=>stateOf(r)===states[0]).length;
      return `<div class="drow">
        <div class="dlab" title="${esc(g.k)}">${esc(g.k)}</div>
        <div class="dtrack" style="width:${g.n/max*100}%">
          ${parts.map(p=>`<i style="flex:${p.v};background:${p.st.c}"
             data-rstate="${esc(p.st.k)}" title="${esc(p.st.t)} — ${p.v}"></i>`).join('')}
        </div>
        <div class="dn">${g.n}</div>
        <div class="dp">${Math.round(done/g.n*100)}%</div></div>`;}).join('')}
    ${keys.length>12?`<div class="dmore">and ${keys.length-12} more</div>`:''}
    <div class="dchips">${states.filter(x=>x.n).map(x=>
      `<span class="dchip" data-rstate="${esc(x.k)}"><i style="background:${x.c}"></i>
        ${esc(x.t)} <b>${x.n}</b></span>`).join('')}</div>
  </div>`;
}

function wireDash(){
  document.querySelectorAll('[data-drill]').forEach(el=>{
    el.style.cursor='pointer';
    el.onclick=e=>{e.stopPropagation();
      const [tab,field,value,state,label]=el.dataset.drill.split('|');
      goDrill(tab,field,value,state,
        label+(state==='done'?' · done':state==='open'?' · outstanding':''));};});
  document.querySelectorAll('[data-kpi]').forEach(el=>{
    el.style.cursor='pointer';
    el.onclick=()=>{
      const [tab,state,label]=el.dataset.kpi.split('|');
      DRILL=null; TAB=tab; VIEW='reg'; F=(state==='done'?'done':'open'); Q='';
      DF={field:'',from:'',to:''};
      paint();
      const w=$wrap(); if(w)w.scrollTop=0;
      toast(rowsNow().length+' · '+label);};});
}
function wireDaily(){
  document.querySelectorAll('[data-days]').forEach(b=>b.onclick=()=>{
    DAYS_BACK=+b.dataset.days; paintTable();});
}
function paint(){
  try{ paintStatus(); }catch(e){}
  paintNav();
  const fab=$('fab');
  if(fab)fab.style.display=(VIEW==='reg'&&canEdit())?'':'none';
  paintRail();
  const onReg = VIEW==='reg';
  $('tabs').style.display  = onReg?'':'none';
  $('tools').style.display = onReg?'':'none';
  $('kpis').style.display  = (VIEW==='dash')?'':'none';
  $('crumb').textContent   = onReg?'':VIEWLABEL[VIEW]||'';
  $('crumb').style.display = onReg?'none':'';
  if(onReg){ paintTabs(); paintKpis(); paintTools(); paintTable(); }
  else if(VIEW==='dash'){ paintKpis(); paintOverview(); wireDash(); wireRegCards(); attachLoupe();
    document.querySelectorAll('.dtbl tr[data-open]').forEach(tr=>
      tr.onclick=()=>{ VIEW='reg'; paint(); openSheet(+tr.dataset.open); }); }
  else if(VIEW==='plan'){ paintPlan(); }
  else if(VIEW==='late'){ paintOverdue(); }
  else { paintMore(); }
  $('sub').textContent = PROJ ? (projCode(PROJ)||projName(PROJ)) : 'all projects';
}

function exportCSV(){
  const cols=COLS[TAB], rows=rowsNow();
  const cell=v=>{const s=String(v??'');
    return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;};
  const csv=[cols.map(c=>cell(c.t)).join(',')]
    .concat(rows.map(r=>cols.map(c=>cell(c.calc?c.calc(r):r[c.k])).join(','))).join('\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));
  a.download='engineering-'+TAB+(PROJ?'-'+(projCode(PROJ)||PROJ):'')+'-'+today+'.csv';
  a.click();
  toast(rows.length+' rows exported');
}

/* ---------- start ---------- */
function start(){
  $('login').classList.remove('on');
  $('app').classList.add('on');
  $('who').textContent=(ME&&ME.name)||((SESSION.user&&SESSION.user.email)||'').split('@')[0];
  SORT={k:COLS[TAB][0].k,dir:1};
  VIEW='dash';
  paint();
  try{ startLive(); }catch(e){ console.warn('Live updates unavailable',e); }
}
/* Names come from the directory; each carries the sign-in address this app
   uses. There is no password to type — see APP_PW below. */
let DIR=[];
async function loadDirectory(){
  const sel=$('lname');
  try{
    const r=await fetch(SB_URL+'/rest/v1/eng_signin?order=seq.asc',
      {headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY}});
    DIR=await r.json();
    if(!Array.isArray(DIR)||!DIR.length)throw new Error('empty');
    sel.innerHTML='<option value="">Choose your name…</option>'+
      DIR.map((d,i)=>`<option value="${i}">${esc(d.name)}</option>`).join('');
    let last=null;try{last=localStorage.getItem('eng-who');}catch(e){}
    if(last!==null&&DIR[last])sel.value=last;
  }catch(e){
    sel.innerHTML='<option value="">Could not load the name list</option>';
  }
}
$('lgo').onclick=async()=>{
  const i=$('lname').value;
  const who=i===''?null:DIR[i];
  const b=$('lgo'), err=$('lerr');
  if(!who){err.textContent='Choose your name first.';return;}
  if(!$('lpw').value){err.textContent='Enter your password.';return;}
  b.disabled=true;b.textContent='Signing in…';err.textContent='';
  try{
    const r=await fetch(SB_URL+'/auth/v1/token?grant_type=password',{method:'POST',
      headers:{apikey:SB_KEY,'Content-Type':'application/json'},
      body:JSON.stringify({email:who.email,password:$('lpw').value})});
    const d=await r.json();
    if(!r.ok)throw new Error(d.error_description||d.msg||'Could not open the tracker');
    SESSION=d;save();
    try{localStorage.setItem('eng-who',i);}catch(e){}
    await loadAll();
    if(!ME)throw new Error('That name is not on this tracker yet.');
    start();
  }catch(e){err.textContent=e.message;b.disabled=false;b.textContent='Sign in';}
};
$('fab').onclick=newRecord;
$('lpw').addEventListener('keydown',e=>{if(e.key==='Enter')$('lgo').click();});
$('out').onclick=()=>{try{localStorage.removeItem('eng-session');}catch(e){}location.reload();};

(async()=>{
  if(await resume()){
    try{ await loadAll(); }
    catch(e){ console.warn('Could not load',e);
      $('login').classList.add('on'); loadDirectory();
      $('lerr').textContent=e.message; return; }
    if(ME){ try{ start(); }catch(e){ console.warn('Start-up hiccup',e); } return; }
  }
  $('login').classList.add('on');
  loadDirectory();
})();
