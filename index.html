<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0613">
<title>Engineering Activity Tracker</title>
<style>
/* ============================================================
   Engineering Activity Tracker
   One file. Same midnight-violet look as the other trackers.
   In Notion these were eight "project databases"; they were really
   three shared tables filtered by project, so this is one register
   with a project picker across the top.
   ============================================================ */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --page1:#150e26; --page2:#0a0613;
  --surface:#171029; --card:#1b1330; --card2:#221739; --chip:#251a42;
  --line:#332552; --line2:#3f2d67;
  --ink:#f5f2ff; --ink2:#bdb2d8; --ink3:#8b81a8;
  --violet:#a855f7; --violet2:#7c3aed; --vsoft:rgba(168,85,247,.15);
  --good:#34d399; --warn:#fbbf24; --hot:#f43f5e; --sky:#38bdf8; --orange:#fb923c;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  --ease:cubic-bezier(.22,1,.36,1);
  --spring:cubic-bezier(.34,1.56,.64,1);
  --shadow:0 14px 40px rgba(10,4,26,.6);
  --safe-b:env(safe-area-inset-bottom,0px);
}
html,body{height:100%;margin:0}
body{
  font:14.5px/1.5 ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);
  background:
    radial-gradient(1100px 620px at 12% -10%, rgba(124,58,237,.22), transparent 60%),
    radial-gradient(900px 520px at 88% 0%,  rgba(168,85,247,.16), transparent 62%),
    linear-gradient(180deg,var(--page1),var(--page2) 60%);
  background-attachment:fixed;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#3f2d67;border-radius:8px;border:2px solid transparent;background-clip:content-box}

#app{display:none;flex-direction:column;height:100%}
#app.on{display:flex}

/* header */
header{padding:16px 22px 0;flex:none}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.mark{width:34px;height:34px;border-radius:11px;flex:none;position:relative;overflow:hidden;
  background:linear-gradient(145deg,var(--violet),var(--violet2));
  box-shadow:0 6px 18px rgba(124,58,237,.5)}
.mark:after{content:"";position:absolute;inset:0;transform:translateX(-100%);
  background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,.5),transparent 70%);
  animation:sheen 6s var(--ease) infinite}
@keyframes sheen{0%,75%{transform:translateX(-100%)}90%,100%{transform:translateX(120%)}}
h1{margin:0;font-size:17px;letter-spacing:-.01em}
h1 small{display:block;font-size:10.5px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink3);margin-top:2px}
.grow{flex:1}
.who{font-size:12px;color:var(--ink3)}
.iconb{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--ink2);
  transition:.2s var(--spring)}
.iconb:hover{background:var(--chip);color:var(--ink);transform:scale(1.08)}

/* project rail */
.rail{display:flex;gap:8px;overflow-x:auto;padding:14px 2px 4px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.pj{flex:none;border:1px solid var(--line);background:var(--card);border-radius:13px;
  padding:9px 14px;text-align:left;transition:.22s var(--ease);min-width:118px;position:relative}
.pj:hover{border-color:var(--line2);transform:translateY(-2px)}
.pj.on{border-color:var(--violet);background:linear-gradient(180deg,rgba(168,85,247,.16),transparent);
  box-shadow:0 0 0 3px rgba(168,85,247,.14)}
.pj b{display:flex;align-items:baseline;gap:6px;font-size:13.5px;white-space:nowrap}
.pj span{font-size:10.5px;color:var(--ink3);font-variant-numeric:tabular-nums}
.pj .code{font-style:normal;font-size:9.5px;font-weight:800;color:var(--violet);letter-spacing:.06em;
  background:rgba(168,85,247,.14);border-radius:20px;padding:1px 6px;flex:none}

/* tabs */
.tabs{display:flex;gap:4px;margin-top:12px;border-bottom:1px solid var(--line)}
.tab{padding:9px 15px;font-size:13px;font-weight:650;color:var(--ink3);border-radius:10px 10px 0 0;
  position:relative;transition:.2s var(--ease)}
.tab:hover{color:var(--ink2);background:var(--chip)}
.tab.on{color:#e9d5ff}
.tab.on:after{content:"";position:absolute;left:12px;right:12px;bottom:-1px;height:2px;
  background:var(--violet);border-radius:2px;box-shadow:0 0 10px var(--violet);
  animation:slide .3s var(--ease)}
@keyframes slide{from{transform:scaleX(.3)}to{transform:none}}
.tab .n{margin-left:7px;font-size:10.5px;background:var(--chip);border-radius:20px;padding:1px 7px;
  color:var(--ink3);font-variant-numeric:tabular-nums}
.tab.on .n{background:rgba(168,85,247,.25);color:#e9d5ff}

/* kpis */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;padding:14px 0 4px}
.kpi{background:linear-gradient(180deg,rgba(38,27,68,.75),rgba(24,17,44,.75));
  border:1px solid rgba(168,85,247,.16);border-radius:14px;padding:12px 14px;
  animation:rise .45s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.kpi .k{font-size:9.5px;font-weight:750;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}
.kpi .v{font-size:25px;font-weight:700;margin:3px 0 2px;letter-spacing:-.02em;
  text-shadow:0 0 22px rgba(168,85,247,.3);font-variant-numeric:tabular-nums}
.kpi .p{font-size:11px;color:var(--ink3)}
.kpi .bar{height:4px;border-radius:4px;background:var(--chip);margin-top:8px;overflow:hidden}
.kpi .bar i{display:block;height:100%;border-radius:4px;transition:width .8s var(--ease)}

/* toolbar */
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px 0}
.f{background:rgba(18,12,33,.85);border:1px solid var(--line2);border-radius:10px;
  padding:8px 11px;outline:none;transition:.2s}
.f:focus{border-color:var(--violet);box-shadow:0 0 0 3px rgba(168,85,247,.16)}
.btn{border:1px solid var(--line2);border-radius:10px;padding:8px 13px;font-size:12.5px;
  font-weight:650;color:var(--ink2);transition:.2s var(--ease)}
.btn:hover{border-color:var(--violet);color:#e9d5ff;transform:translateY(-1px)}
.btn.on{background:linear-gradient(180deg,var(--violet),var(--violet2));border-color:transparent;color:#fff}
.count{margin-left:auto;font-size:12px;color:var(--ink3);font-variant-numeric:tabular-nums}

/* table */
.wrap{flex:1;overflow:auto;padding:0 22px 90px}
table.g{width:max-content;min-width:100%;border-collapse:separate;border-spacing:0;font-size:12.5px;
  table-layout:fixed}
table.g th{position:sticky;top:0;z-index:3;text-align:left;padding:8px 10px;font-size:10.5px;
  font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#c4b5fd;
  background:linear-gradient(180deg,#2a1d4d,#221739);border-bottom:1px solid rgba(168,85,247,.22);
  cursor:pointer;white-space:nowrap}
table.g th:hover{color:#fff}
table.g td{padding:8px 10px;border-bottom:1px solid var(--grid,#2b1f47);color:var(--ink2);
  vertical-align:middle;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
table.g tbody tr{animation:rise .35s var(--ease) both}
table.g tbody tr:nth-child(even) td{background:rgba(31,22,54,.5)}
table.g tbody tr:hover td{background:var(--chip)}
td.mono{font-family:var(--mono);color:var(--ink)}
td.wrapc{white-space:normal;line-height:1.45;unicode-bidi:plaintext}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:20px;padding:2px 9px;
  font-size:11px;font-weight:650;white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;flex:none}

.empty{text-align:center;padding:64px 20px;color:var(--ink3)}
.empty .big{font-size:42px;margin-bottom:10px;animation:float 3.4s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:6px}

/* charts */
.panels{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;padding:4px 0}
.panel{background:linear-gradient(180deg,rgba(34,24,60,.55),rgba(24,17,44,.55));
  border:1px solid rgba(168,85,247,.14);border-radius:15px;padding:15px 17px}
.panel h3{margin:0 0 12px;font-size:10.5px;font-weight:750;letter-spacing:.1em;
  text-transform:uppercase;color:#c4b5fd}
.brow{display:grid;grid-template-columns:118px 1fr 62px;gap:10px;align-items:center;margin-bottom:8px}
.blab{font-size:12px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btrack{height:9px;border-radius:6px;background:var(--chip);overflow:hidden;display:flex}
.btrack i{display:block;height:100%;transition:flex .7s var(--ease);cursor:pointer}
.bnum{font-size:11.5px;color:var(--ink3);text-align:right;font-variant-numeric:tabular-nums}
.bnum b{color:var(--good);font-weight:700}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:10px;font-weight:700;
  letter-spacing:.05em;text-transform:uppercase;color:var(--ink3)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:9px;border-radius:3px;display:inline-block}

/* login */
#login{position:fixed;inset:0;z-index:80;display:none;place-items:center;padding:20px;
  background:radial-gradient(900px 500px at 50% 0%,rgba(124,58,237,.25),transparent 65%),
             linear-gradient(180deg,var(--page1),var(--page2))}
#login.on{display:grid}
#login .box{width:min(400px,100%);border:1px solid rgba(168,85,247,.25);border-radius:22px;padding:30px;
  background:linear-gradient(180deg,rgba(35,25,62,.96),rgba(20,14,38,.98));
  box-shadow:0 30px 90px rgba(88,28,135,.5);animation:rise .5s var(--ease)}
#login h2{margin:0 0 5px;font-size:21px}
#login p{margin:0 0 20px;color:var(--ink3);font-size:13px}
#login .f{width:100%;margin-bottom:10px}
#login .btn{width:100%;text-align:center;margin-top:6px;padding:11px}
#lerr{color:#fda4af;font-size:12.5px;min-height:18px;margin-top:8px}

#toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,24px);z-index:90;opacity:0;
  background:rgba(35,25,62,.97);border:1px solid rgba(168,85,247,.3);border-radius:12px;
  padding:10px 17px;font-size:13px;pointer-events:none;transition:.32s var(--ease)}
#toast.on{opacity:1;transform:translate(-50%,0)}

@media (max-width:760px){
  header{padding:12px 14px 0}
  .wrap{padding:0 14px calc(80px + var(--safe-b))}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .tab{padding:9px 11px;font-size:12.5px}
  table.g td,table.g th{padding:7px 8px}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.06s!important}}

/* editor sheet */
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);z-index:60;display:flex;
  flex-direction:column;transform:translateX(102%);transition:transform .42s var(--ease);
  background:linear-gradient(180deg,rgba(34,23,57,.99),rgba(20,14,38,.99));
  border-left:1px solid rgba(168,85,247,.2);box-shadow:-30px 0 80px rgba(5,2,14,.6)}
.sheet.on{transform:none}
.sheet .sh{display:flex;align-items:center;gap:10px;padding:16px 18px;
  border-bottom:1px solid var(--line)}
.sheet .sb{flex:1;overflow:auto;padding:18px}
.fld{margin-bottom:14px}
.fld label{display:block;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink3);margin-bottom:5px}
.fld input,.fld textarea,.fld select{width:100%;background:rgba(18,12,33,.85);
  border:1px solid var(--line2);border-radius:10px;padding:9px 11px;outline:none;transition:.2s}
.fld textarea{min-height:74px;resize:vertical;line-height:1.5}
.fld input:focus,.fld textarea:focus,.fld select:focus{border-color:var(--violet);
  box-shadow:0 0 0 3px rgba(168,85,247,.16)}
.fld input:disabled,.fld textarea:disabled,.fld select:disabled{opacity:.55}

/* dialog */
#msg{position:fixed;inset:0;z-index:75;display:none;place-items:center;padding:20px;
  background:rgba(8,4,18,.6);backdrop-filter:blur(3px)}
#msg.on{display:grid}
.mbox{width:min(420px,100%);border:1px solid rgba(168,85,247,.25);border-radius:18px;padding:22px;
  background:linear-gradient(180deg,rgba(35,25,62,.98),rgba(20,14,38,.99));
  box-shadow:0 30px 80px rgba(5,2,14,.6);animation:rise .35s var(--ease)}
.mbox h4{margin:0 0 12px;font-size:16px}
.macts{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.dfl label{display:block;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink3);margin:10px 0 5px}
.dfl .two{display:flex;gap:10px}.dfl .two>div{flex:1}.dfl .f{width:100%}
.dpre{display:flex;flex-wrap:wrap;gap:6px}
.dpre button{border:1px solid var(--line2);background:var(--card);color:var(--ink2);
  border-radius:20px;padding:5px 11px;font:inherit;font-size:11.5px;cursor:pointer}
.dpre button:hover{border-color:var(--violet)}
.dpre button.on{background:linear-gradient(180deg,var(--violet),var(--violet2));
  border-color:transparent;color:#fff}

/* day by day */
.dayfilt{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.dayfilt button{border:1px solid var(--line2);background:var(--card);color:var(--ink2);
  border-radius:20px;padding:4px 12px;font:inherit;font-size:11.5px;font-weight:600;cursor:pointer}
.dayfilt button.on{background:linear-gradient(180deg,var(--violet),var(--violet2));
  border-color:transparent;color:#fff}
table.daily{width:100%;border-collapse:collapse;font-size:12.5px}
table.daily th{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);color:var(--ink3);
  font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
table.daily th.n,table.daily td.n{text-align:right;font-family:var(--mono)}
table.daily td{padding:6px 8px;border-bottom:1px solid var(--line);color:var(--ink2)}
table.daily td b{color:var(--ink)}
table.daily td.good{color:var(--good);font-weight:700}
table.daily td.info{color:var(--sky);font-weight:700}
table.daily th.bar,table.daily td.bar{width:30%}
table.daily td.bar i{display:block;height:6px;border-radius:4px;margin:2px 0}
table.daily td.bar i.s{background:var(--sky)} table.daily td.bar i.r{background:var(--good)}
table.daily tr.td-today td{background:var(--chip)}
.nowtag{font-size:9.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--violet);
  border:1px solid var(--violet);border-radius:10px;padding:0 6px;margin-left:5px}

/* print */
#printroot{display:none}
@media print{
  body{background:#fff!important;color:#000!important;overflow:visible!important}
  #app,#toast,.sheet,#msg{display:none!important}
  #printroot{display:block!important;padding:0}
  @page{size:A4 landscape;margin:10mm 8mm}
  .rhead h1{font-size:14pt;margin:0 0 3pt;color:#000}
  .rsub{font-size:8.5pt;color:#444;margin-bottom:8pt}
  table.rtbl{width:100%;border-collapse:collapse;font-size:7.4pt;table-layout:fixed}
  table.rtbl th{background:#eee;text-align:left;padding:3pt;border:.5pt solid #999;color:#000}
  table.rtbl td{padding:2.5pt 3pt;border:.5pt solid #bbb;word-wrap:break-word;
    overflow-wrap:anywhere;color:#000}
  table.rtbl tr{page-break-inside:avoid}
}

.hist{margin:16px 0 4px;border-top:1px solid var(--line);padding-top:14px}
.hist>label{display:block;font-size:10px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink3);margin-bottom:8px}
.hrow{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:8px 10px;margin-bottom:6px;
  background:var(--card);border:1px solid var(--line);border-radius:10px;font-size:12px}
.hrow.cur{border-color:rgba(168,85,247,.4)}
.hrow b{font-family:var(--mono);color:var(--ink)}
.hrow span{color:var(--ink2);font-family:var(--mono);font-size:11.5px}
.hrow i{margin-left:auto;color:var(--ink3);font-style:normal;font-size:11px}
.hrow .hx{color:var(--ink3);opacity:.6;font-size:12px}
.hrow .hx:hover{color:#fda4af;opacity:1}

/* ---------- desktop top bar ---------- */
#topbar{display:flex;align-items:center;gap:6px;padding:9px 18px;flex:none;
  background:linear-gradient(180deg,rgba(30,21,54,.96),rgba(18,12,34,.92));
  border-bottom:1px solid rgba(168,85,247,.16);backdrop-filter:blur(12px)}
#topbar .mark{width:30px;height:30px;border-radius:9px}
#topbar .title{font-size:14.5px;font-weight:700;letter-spacing:-.01em;margin-right:10px}
#topbar .title small{display:block;font-size:9.5px;font-weight:700;letter-spacing:.09em;
  text-transform:uppercase;color:var(--ink3)}
.tbbtn{padding:7px 13px;border-radius:10px;font-size:13px;font-weight:650;color:var(--ink2);
  transition:.18s var(--ease);position:relative}
.tbbtn:hover{background:var(--chip);color:var(--ink)}
.tbbtn.on{color:#e9d5ff;background:linear-gradient(180deg,rgba(168,85,247,.2),transparent)}
.tbbtn.on:after{content:"";position:absolute;left:12px;right:12px;bottom:2px;height:2px;
  border-radius:2px;background:var(--violet);box-shadow:0 0 10px var(--violet)}
.crumb{font-size:11px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;
  color:var(--ink3);padding:12px 0 2px}

/* ---------- cards used by Plan, Overdue and More ---------- */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px;padding:4px 0}
.lcard{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--line2);
  border-radius:13px;padding:12px 14px;cursor:pointer;animation:rise .4s var(--ease) both;
  transition:transform .2s var(--ease),border-color .2s,box-shadow .2s}
.lcard:hover{transform:translateY(-2px);border-color:var(--line2);box-shadow:var(--shadow)}
.lcard.ok{border-left-color:var(--good)} .lcard.bad{border-left-color:var(--hot)}
.lc-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lc-top b{font-size:13.5px;font-family:var(--mono);color:var(--ink)}
.tagk{font-size:9.5px;font-weight:750;letter-spacing:.07em;text-transform:uppercase;
  color:var(--ink3);background:var(--chip);border-radius:20px;padding:2px 8px}
.lc-top .late{margin-left:auto;color:var(--hot);font-size:11.5px;font-weight:700}
.lc-top .ok{margin-left:auto;color:var(--good);font-size:11.5px;font-weight:700}
.lc-top .due{margin-left:auto;color:var(--sky);font-size:11.5px;font-weight:700}
.lc-what{font-size:13px;color:var(--ink2);margin-top:6px;line-height:1.45}
.lc-meta{font-size:11.5px;color:var(--ink3);margin-top:6px}

/* ---------- plan ---------- */
.planbar{display:flex;align-items:center;gap:9px;padding:4px 0 12px}
.planbar .wk{text-align:center;min-width:170px}
.planbar .wk b{display:block;font-size:14px}
.planbar .wk span{font-size:11px;color:var(--ink3)}
.planprog{background:linear-gradient(180deg,rgba(38,27,68,.75),rgba(24,17,44,.75));
  border:1px solid rgba(168,85,247,.16);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.pnum{display:flex;align-items:baseline;gap:10px}
.pnum b{font-size:26px;letter-spacing:-.02em}
.pnum span{color:var(--ink3);font-size:12.5px}
.ptrack{height:7px;border-radius:5px;background:var(--chip);margin:10px 0 8px;overflow:hidden}
.ptrack i{display:block;height:100%;border-radius:5px;
  background:linear-gradient(90deg,var(--violet),var(--good));transition:width .8s var(--ease)}
.pleg{display:flex;gap:14px;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.pleg .g{color:var(--good)} .pleg .r{color:var(--hot)} .pleg .n{color:var(--ink3)}

/* ---------- phone tab bar ---------- */
#mtabs{display:none;position:fixed;left:0;right:0;bottom:0;z-index:70;
  background:rgba(20,14,38,.95);backdrop-filter:blur(16px);
  border-top:1px solid rgba(168,85,247,.16);padding-bottom:var(--safe-b)}
#mtabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;
  padding:8px 2px 9px;font-size:9.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  color:var(--ink3);position:relative;transition:color .15s}
#mtabs button svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round;transition:transform .25s var(--spring)}
#mtabs button.on{color:var(--violet)}

const isoDay=d=>{const x=(d instanceof Date)?d:new Date(d);
  return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+
         String(x.getDate()).padStart(2,'0');};

async function api(path,opts={},tries=0){
  const r=await fetch(SB_URL+'/rest/v1/'+path,{...opts,headers:{
    apikey:SB_KEY,Authorization:'Bearer '+(SESSION?SESSION.access_token:SB_KEY),
    'Content-Type':'application/json',Prefer:'return=representation',...(opts.headers||{})}});
  if(r.ok){const t=await r.text();return t?JSON.parse(t):null;}
  const body=await r.text();
  /* the sign-in server can mint a token a moment ahead of the database clock */
  if(/PGRST303|issued at future/.test(body)&&tries<4){
    await new Promise(res=>setTimeout(res,900+tries*700));
    return api(path,opts,tries+1);
  }
  if(r.status===401&&tries<1&&await resume())return api(path,opts,tries+1);
  throw new Error(readable(body,r.status));
}
function readable(body,status){
  try{const j=JSON.parse(body);
    if(/issued at future/.test(j.message||''))
      return 'This device’s clock is out of step with the server. Check date and time, then try again.';
    if(j.message)return j.message;}catch(e){}
  return body.slice(0,120)||('Request failed ('+status+')');
}
const save=()=>{try{localStorage.setItem('eng-session',JSON.stringify(SESSION));}catch(e){}};
async function resume(){
  let s=null;try{s=JSON.parse(localStorage.getItem('eng-session')||'null');}catch(e){}
  if(!s||!s.refresh_token)return false;
  const r=await fetch(SB_URL+'/auth/v1/token?grant_type=refresh_token',{method:'POST',
    headers:{apikey:SB_KEY,'Content-Type':'application/json'},
    body:JSON.stringify({refresh_token:s.refresh_token})});
  if(!r.ok)return false;
  SESSION=await r.json();save();return true;
}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');
  clearTimeout(t._x);t._x=setTimeout(()=>t.classList.remove('on'),3000);}

/* The database returns at most 1000 rows per request whatever limit is asked
   for, so anything that can grow past that must be fetched page by page —
   otherwise the register quietly shows part of the data and looks correct. */
const PAGE=1000;
async function apiAll(path){
  let out=[], from=0;
  for(let guard=0; guard<40; guard++){
    const part=await api(path,{headers:{Range:from+'-'+(from+PAGE-1),
      'Range-Unit':'items',Prefer:'count=none'}});
    const got=part||[];
    out=out.concat(got);
    if(got.length<PAGE)break;
    from+=PAGE;
  }
  return out;
}

function rowsNow(){
  let rows = TAB==='gis'?gisFor()
           : TAB==='shop'?sdFor() : TAB==='invoice'?invFor() : abFor();
  if(F==='open'){
    rows = TAB==='invoice'  ? rows.filter(r=>r.status!=='Submitted')
         : TAB==='asbuilts' ? rows.filter(r=>!AB_DONE(r.status))
         : rows.filter(r=>!GIS_OK(r.review_status));
  } else if(F==='done'){
    rows = TAB==='invoice'  ? rows.filter(r=>r.status==='Submitted')
         : TAB==='asbuilts' ? rows.filter(r=>AB_DONE(r.status))
         : rows.filter(r=>GIS_OK(r.review_status));
  }
  if(DF.field&&(DF.from||DF.to)){
    rows=rows.filter(r=>{const v=r[DF.field]||'';
      if(!v)return false;
      if(DF.from&&v<DF.from)return false;
      if(DF.to&&v>DF.to)return false;
      return true;});
  }
  if(Q){
    const q=Q.toLowerCase();
    rows = rows.filter(r=>Object.values(r).some(v=>String(v??'').toLowerCase().includes(q)));
  }
  const c=(COLS[TAB]||[]).find(x=>x.k===SORT.k);
  return rows.slice().sort((a,b)=>{
    const va=c&&c.calc?c.calc(a):(a[SORT.k]??''), vb=c&&c.calc?c.calc(b):(b[SORT.k]??'');
    const ea=String(va).trim()==='', eb=String(vb).trim()==='';
    if(ea!==eb)return ea?1:-1;
    const na=parseFloat(va),nb=parseFloat(vb);
    if(!isNaN(na)&&!isNaN(nb))return (na-nb)*SORT.dir;
    return String(va).localeCompare(String(vb))*SORT.dir;
  });
}

function rowsOf(tab){ return tab==='gis'?gisFor()

            `<option${String(v)===o?' selected':''}>${esc(o)}</option>`).join('')}</select>`

      <div class="fld"><label>Project</label>
        <select id="f-project_id"${canEdit()?'':' disabled'}>

/* ---------- filter by a date range ---------- */
function openDateFilter(){
  const cols=DATECOLS[TAB]||[];
  if(!cols.length)return toast('This register has no dates to filter on');
  const shift=n=>{const d=new Date(today+'T00:00:00');d.setDate(d.getDate()+n);return isoDay(d);};
  const presets=[['Today',today,today],['Last 7 days',shift(-6),today],
    ['Last 30 days',shift(-29),today],['This month',today.slice(0,8)+'01',today],
    ['Next 7 days',today,shift(6)],['Before today','',shift(-1)]];
  const dlg=msgBox('Filter by date',
    `<div class="dfl"><label>Which date</label>
      <select class="f" id="dff">${cols.map(([k,l])=>
        `<option value="${k}"${DF.field===k?' selected':''}>${esc(l)}</option>`).join('')}</select>
      <div class="two"><div><label>From</label><input class="f" type="date" id="dfa" value="${esc(DF.from)}"></div>
      <div><label>To</label><input class="f" type="date" id="dfb" value="${esc(DF.to)}"></div></div>
      <label>Or pick a period</label>
      <div class="dpre">${presets.map(([l,a,b])=>
        `<button data-a="${a}" data-b="${b}">${l}</button>`).join('')}</div>
      <div style="color:var(--ink3);font-size:11.5px;margin-top:8px">
        Records with no date in that column are left out while a range is set.</div></div>`,
    [['Clear',()=>{DF={field:'',from:'',to:''};paint();},''],
     ['Apply',()=>{DF={field:document.getElementById('dff').value,
        from:document.getElementById('dfa').value,to:document.getElementById('dfb').value};
        paint(); toast(rowsNow().length+' records in that period');},'on']]);
  dlg.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{
    dlg.querySelector('#dfa').value=b.dataset.a;
    dlg.querySelector('#dfb').value=b.dataset.b;
    dlg.querySelectorAll('[data-a]').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');});
}
function msgBox(title,body,acts){
  let m=document.getElementById('msg');
  if(!m){m=document.createElement('div');m.id='msg';document.body.appendChild(m);}
  m.innerHTML=`<div class="mbox"><h4>${esc(title)}</h4><div class="mb">${body}</div>
    <div class="macts">${acts.map(([l,,cls],i)=>
      `<button class="btn ${cls||''}" data-i="${i}">${esc(l)}</button>`).join('')}</div></div>`;
  m.classList.add('on');
  m.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{
    const fn=acts[+b.dataset.i][1]; m.classList.remove('on'); if(fn)fn();});
  return m;
}

/* ---------- day by day ---------- */
let DAYS_BACK=14;
function dailyPanel(){
  const cols=DATECOLS[TAB]||DATECOLS.shop;
  const rows=[];
  const src = (VIEW==='dash') ? sdFor() : rowsOf(TAB);
  const subK='submitted_date', recK='received_date';
  for(let i=0;i<DAYS_BACK;i++){
    const d=new Date(today+'T00:00:00'); d.setDate(d.getDate()-i);
    const k=isoDay(d);
    rows.push({k,d,out:src.filter(r=>r[subK]===k).length,
                 back:src.filter(r=>r[recK]===k).length});
  }
  const any=rows.some(r=>r.out||r.back);
  const best=Math.max(1,...rows.map(r=>Math.max(r.out,r.back)));
  const fmt=d=>d.toLocaleDateString('en-GB',{weekday:'short',day:'2-digit',month:'short'});
  return `<div class="panel"><h3>Day by day — submitted and returned</h3>
    <div class="dayfilt">${[7,14,30,60].map(n=>
      `<button data-days="${n}" class="${DAYS_BACK===n?'on':''}">${n} days</button>`).join('')}</div>
    <table class="daily"><thead><tr><th>Day</th>
      <th class="n">Submitted</th><th class="n">Returned</th><th class="bar"></th></tr></thead>
    <tbody>${rows.map(r=>`<tr${r.k===today?' class="td-today"':''}>
      <td><b>${fmt(r.d)}</b>${r.k===today?' <span class="nowtag">today</span>':''}</td>
      <td class="n ${r.out?'info':''}">${r.out||'—'}</td>
      <td class="n ${r.back?'good':''}">${r.back||'—'}</td>
      <td class="bar"><i class="s" style="width:${r.out/best*100}%"></i>
        <i class="r" style="width:${r.back/best*100}%"></i></td></tr>`).join('')}
    </tbody></table>
    ${any?'':'<div style="color:var(--ink3);font-size:12px;padding:8px 2px">Nothing moved in this window.</div>'}
  </div>`;
}

  let root=document.getElementById('printroot');

  const label=(TABS.find(t=>t.k===TAB)||{}).t||'';
  root.innerHTML=`<div class="rhead"><h1>Engineering Activity — ${esc(label)}</h1>
      <div class="rsub">${esc(PROJ?projName(PROJ):'All projects')} · ${rows.length} records · ${
        new Date().toLocaleDateString('en-GB')}${ME?' · '+esc(ME.name):''}</div></div>
    <table class="rtbl"><thead><tr><th>#</th>${cols.map(c=>`<th>${esc(c.t)}</th>`).join('')}</tr></thead>
    <tbody>${rows.map((r,i)=>`<tr><td>${i+1}</td>${cols.map(c=>{
      const v=c.calc?c.calc(r):r[c.k];
      return `<td>${esc(v==null?'':String(v))}</td>`;}).join('')}</tr>`).join('')}
    </tbody></table>`;
  document.body.classList.add('printing');
  const done=()=>{document.body.classList.remove('printing');
    window.removeEventListener('afterprint',done);};
  window.addEventListener('afterprint',done);
  window.print(); setTimeout(done,1200);
}


/* ---------- submission history ---------- */
const KIND={asbuilts:'asbuilt',shop:'shop',gis:'gis'};
const cyclesOf=(kind,id)=>HIST.filter(h=>h.kind===kind&&h.record_id===id)
  .sort((a,b)=>(parseFloat(String(a.revision).replace(/\D/g,''))||0)
              -(parseFloat(String(b.revision).replace(/\D/g,''))||0)||a.id-b.id);
function historyHTML(kind,id){
  const cy=cyclesOf(kind,id);
  return `<div class="hist"><label>Submission history</label>
    ${cy.length?cy.map((h,i)=>{
      const days=(h.submitted&&h.received)
        ? Math.round((new Date(h.received)-new Date(h.submitted))/864e5) : null;
      return `<div class="hrow${i===cy.length-1?' cur':''}" data-h="${h.id}">
        <b>Rev ${esc(h.revision)}</b>
        <span>${h.submitted?esc(h.submitted):'—'} → ${h.received?esc(h.received):'with the reviewer'}</span>
        ${h.outcome?pill(h.outcome):''}
        ${days!==null?`<i>${days}d</i>`:''}
        ${canEdit()?`<button class="hx" data-del="${h.id}" title="Remove">✕</button>`:''}
      </div>`;}).join('')
      :'<div style="color:var(--ink3);font-size:12px;padding:6px 0">No cycles recorded yet.</div>'}
    ${canEdit()?`<button class="btn" id="logcy" style="margin-top:8px">Log a submission</button>`:''}
  </div>`;
}
function logCycle(kind,id){
  const cy=cyclesOf(kind,id);
  const next=cy.length
    ? String((parseFloat(String(cy[cy.length-1].revision).replace(/\D/g,''))||0)+1) : '0';
  const dlg=msgBox('Log a submission',
    `<div class="dfl"><label>Revision</label><input class="f" id="cr" value="${next}">
      <div class="two"><div><label>Sent</label><input class="f" type="date" id="cs" value="${today}"></div>
      <div><label>Replied</label><input class="f" type="date" id="cc"></div></div>
      <label>Outcome</label>
      <select class="f" id="co"><option value="">— still with the reviewer —</option>
        ${REVIEW.filter(r=>r!=='Not Submitted').map(r=>`<option>${esc(r)}</option>`).join('')}</select>
      <div style="color:var(--ink3);font-size:11.5px;margin-top:8px">
        The record takes its dates and status from the newest cycle.</div></div>`,
    [['Cancel',null,''],['Save',async()=>{
      const body={kind,record_id:id,
        revision:dlg.querySelector('#cr').value.trim()||next,
        submitted:dlg.querySelector('#cs').value,
        received:dlg.querySelector('#cc').value,
        outcome:dlg.querySelector('#co').value,
        actor:(ME&&ME.name)||''};
      try{
        const made=await api('eng_history',{method:'POST',body:JSON.stringify(body)});
        if(made&&made[0])HIST.push(made[0]);
        await reloadRecord(kind,id);
        toast('Submission logged');
      }catch(e){ toast(e.message); }
    },'on']]);
}
async function reloadRecord(kind,id){
  const table = kind==='shop'?'eng_shopdrawings':kind==='gis'?'eng_gis':'eng_asbuilts';
  const list  = kind==='shop'?SD:kind==='gis'?GIS:AB;
  try{
    const fresh=await api(table+'?id=eq.'+id);
    if(fresh&&fresh[0]){const i=list.findIndex(r=>r.id===id); if(i>=0)Object.assign(list[i],fresh[0]);}
  }catch(e){}
  paint(); openSheet(id);
}

/* ---------- Plan: what is meant to go out, week by week ---------- */
let WEEK=0;
function weekStart(off){
  const d=new Date(today+'T00:00:00');
  d.setDate(d.getDate()-((d.getDay()+1)%7)+off*7);   /* weeks run Sunday to Saturday */
  return isoDay(d);
}
function paintPlan(){
  const from=weekStart(WEEK), to=(()=>{const d=new Date(from+'T00:00:00');
    d.setDate(d.getDate()+6);return isoDay(d);})();
  const inWeek=r=>r.planned_date>=from&&r.planned_date<=to;
  const items=[...sdFor().filter(r=>r.planned_date&&inWeek(r)).map(r=>({...r,kind:'Shop drawing',tab:'shop'})),
               ...gisFor().filter(r=>r.planned_date&&inWeek(r)).map(r=>({...r,kind:'GIS',tab:'gis'}))]
    .sort((a,b)=>a.planned_date<b.planned_date?-1:1);
  const done=items.filter(r=>r.submitted_date&&r.submitted_date<=to).length;
  const late=items.filter(r=>!r.submitted_date&&r.planned_date<today).length;
  const pct=items.length?Math.round(done/items.length*100):0;
  const fmt=d=>new Date(d+'T00:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short'});
  $('wrap').innerHTML=`
    <div class="planbar">
      <button class="btn" id="wprev">‹</button>
      <div class="wk"><b>${fmt(from)} – ${fmt(to)}</b>
        <span>${WEEK===0?'this week':WEEK===1?'next week':WEEK===-1?'last week'
          :(WEEK>0?WEEK+' weeks ahead':(-WEEK)+' weeks back')}</span></div>
      <button class="btn" id="wnext">›</button>
      <button class="btn" id="wnow">Today</button>
    </div>
    <div class="planprog"><div class="pnum"><b>${pct}%</b>
        <span>${done} of ${items.length} sent</span></div>
      <div class="ptrack"><i style="width:${pct}%"></i></div>
      <div class="pleg"><span class="g">${done} sent</span>
        <span class="r">${late} overdue</span>
        <span class="n">${items.length-done-late} still to come</span></div></div>
    ${items.length?`<div class="cards">${items.map((r,i)=>{
      const sent=!!r.submitted_date, isLate=!sent&&r.planned_date<today;
      return `<article class="lcard ${sent?'ok':isLate?'bad':''}" data-go="${r.tab}:${r.id}"
          style="animation-delay:${Math.min(i,14)*24}ms">
        <div class="lc-top"><span class="tagk">${esc(r.kind)}</span>
          <b>${esc(r.submittal_no||r.description)}</b>
          <span class="${sent?'ok':isLate?'late':'due'}">${
            sent?'sent '+esc(r.submitted_date):isLate?daysLate(r.planned_date)+'d late':'due '+esc(r.planned_date)}</span></div>
        <div class="lc-what">${esc(r.description||'')}</div>
        <div class="lc-meta">${esc(projName(r.project_id))} · ${esc(r.review_status)}</div>
      </article>`;}).join('')}</div>`
    :`<div class="empty"><div class="big">📅</div><b>Nothing planned for this week</b>
      Planned dates come from the drawings themselves — set one and it appears here.</div>`}`;
  $('wprev').onclick=()=>{WEEK--;paintPlan();};
  $('wnext').onclick=()=>{WEEK++;paintPlan();};
  $('wnow').onclick=()=>{WEEK=0;paintPlan();};
  $('wrap').querySelectorAll('[data-go]').forEach(el=>el.onclick=()=>{
    const [tab,id]=el.dataset.go.split(':');
    TAB=tab; VIEW='reg'; paint(); openSheet(+id);});
}

function bars(title,groups,colFor){
  const max=Math.max(1,...groups.map(g=>g.total));
  if(!groups.length)return `<div class="panel"><h3>${title}</h3>
    <div class="empty" style="padding:20px">Nothing yet.</div></div>`;
  return `<div class="panel"><h3>${title}</h3>${groups.map(g=>`
    <div class="brow"><div class="blab" title="${esc(g.k)}">${esc(g.k)}</div>
      <div class="btrack" style="width:${g.total/max*100}%">
        <i style="flex:${g.done};background:var(--good)"></i>
        <i style="flex:${g.total-g.done};background:${colFor||'var(--hot)'}"></i></div>
      <div class="bnum"><b>${g.done}</b>/${g.total}</div></div>`).join('')}
    <div class="legend"><span><i style="background:var(--good)"></i>done</span>
      <span><i style="background:${colFor||'var(--hot)'}"></i>outstanding</span>
      <span style="margin-left:auto;text-transform:none;letter-spacing:0">done / total</span>
      </div></div>`;
}
function group(rows,keyFn,doneFn){
  const m={};
  rows.forEach(r=>{const k=keyFn(r)||'(not set)';
    (m[k]=m[k]||{k,total:0,done:0});m[k].total++;if(doneFn(r))m[k].done++;});
  return Object.values(m).sort((a,b)=>(b.total-b.done)-(a.total-a.done)||b.total-a.total);
}

function exportCSV(){
  const cols=COLS[TAB], rows=rowsNow();
  const cell=v=>{const s=String(v??'');
    return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;};
  const csv=[cols.map(c=>cell(c.t)).join(',')]
    .concat(rows.map(r=>cols.map(c=>cell(c.calc?c.calc(r):r[c.k])).join(','))).join('\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));
  a.download='engineering-'+TAB+(PROJ?'-'+(projCode(PROJ)||PROJ):'')+'-'+today+'.csv';
  a.click();
  toast(rows.length+' rows exported');
}

/* ---------- start ---------- */
function start(){
  $('login').classList.remove('on');
  $('app').classList.add('on');
  $('who').textContent=(ME&&ME.name)||((SESSION.user&&SESSION.user.email)||'').split('@')[0];
  SORT={k:COLS[TAB][0].k,dir:1};
  paint();
}
/* Names come from the directory; each carries the sign-in address this app
   uses. There is no password to type — see APP_PW below. */
let DIR=[];
async function loadDirectory(){
  const sel=$('lname');
  try{
    const r=await fetch(SB_URL+'/rest/v1/eng_signin?order=seq.asc',
      {headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY}});
    DIR=await r.json();
    if(!Array.isArray(DIR)||!DIR.length)throw new Error('empty');
    sel.innerHTML='<option value="">Choose your name…</option>'+
      DIR.map((d,i)=>`<option value="${i}">${esc(d.name)}</option>`).join('');
    let last=null;try{last=localStorage.getItem('eng-who');}catch(e){}
    if(last!==null&&DIR[last])sel.value=last;
  }catch(e){
    sel.innerHTML='<option value="">Could not load the name list</option>';
  }
}
$('lgo').onclick=async()=>{
  const i=$('lname').value;
  const who=i===''?null:DIR[i];
  const b=$('lgo'), err=$('lerr');
  if(!who){err.textContent='Choose your name first.';return;}
  if(!$('lpw').value){err.textContent='Enter your password.';return;}
  b.disabled=true;b.textContent='Signing in…';err.textContent='';
  try{
    const r=await fetch(SB_URL+'/auth/v1/token?grant_type=password',{method:'POST',
      headers:{apikey:SB_KEY,'Content-Type':'application/json'},
      body:JSON.stringify({email:who.email,password:$('lpw').value})});
    const d=await r.json();
    if(!r.ok)throw new Error(d.error_description||d.msg||'Could not open the tracker');
    SESSION=d;save();
    try{localStorage.setItem('eng-who',i);}catch(e){}
    await loadAll();
    if(!ME)throw new Error('That name is not on this tracker yet.');
    start();
  }catch(e){err.textContent=e.message;b.disabled=false;b.textContent='Sign in';}
};
$('lpw').addEventListener('keydown',e=>{if(e.key==='Enter')$('lgo').click();});
$('out').onclick=()=>{try{localStorage.removeItem('eng-session');}catch(e){}location.reload();};

(async()=>{
  if(await resume()){
    try{ await loadAll(); }
    catch(e){ console.warn('Could not load',e);
      $('login').classList.add('on'); loadDirectory();
      $('lerr').textContent=e.message; return; }
    if(ME){ try{ start(); }catch(e){ console.warn('Start-up hiccup',e); } return; }
  }
  $('login').classList.add('on');
  loadDirectory();
})();
</script>
