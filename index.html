<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="var(--page2)">
<title>Engineering Activity Tracker</title>
<style>
/* ============================================================
   Engineering Activity Tracker
   One file. Same midnight-violet look as the other trackers.
   In Notion these were eight "project databases"; they were really
   three shared tables filtered by project, so this is one register
   with a project picker across the top.
   ============================================================ */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  /* the LOD tracker's palette, value for value */
  color-scheme:light;
  --page1:#eef1f4; --page2:#e4e9ee;
  --glass:rgba(252,252,251,.94); --surface:#fcfcfb; --surface2:#f0efec; --field:#ffffff;
  --card:#fcfcfb; --card2:#f0efec; --chip:#f0efec;
  --ink:#0b0b0b; --ink2:#52514e; --ink3:#898781; --muted:#898781;
  --line:#e1e0d9; --line2:#cfcec6; --grid:#e1e0d9; --ring:rgba(11,11,11,.09);
  --accent:#2a78d6; --accent-soft:rgba(42,120,214,.10); --accent-soft2:rgba(42,120,214,.16);
  --violet:#2a78d6; --violet2:#1f5fae; --vsoft:rgba(42,120,214,.10);
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --critical:#d03b3b;
  --hot:#d03b3b; --sky:#2a78d6; --orange:#ec835a; --goodtext:#006300;
  --sel:rgba(42,120,214,.14); --selb:#2a78d6;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  --ease:cubic-bezier(.22,1,.36,1);
  --spring:cubic-bezier(.34,1.56,.64,1);
  --shadow:0 10px 34px rgba(15,20,30,.16),0 2px 8px rgba(15,20,30,.08);
  --shadow-focus:0 18px 50px rgba(15,20,30,.24),0 3px 10px rgba(15,20,30,.10);
  --safe-b:env(safe-area-inset-bottom,0px);
}
:root[data-theme="dark"]{
  color-scheme:dark;
  /* Deep navy, cards a shade lighter, one blue accent with amber beside it. */
  --page1:#131c33; --page2:#0d1424;
  --glass:rgba(27,36,64,.94); --surface:#1b2440; --surface2:#222c4d; --field:#161e36;
  --card:#1b2440; --card2:#222c4d; --chip:#26304d;
  --ink:#ffffff; --ink2:#9fabc9; --ink3:#6f7c9c; --muted:#6f7c9c;
  --line:#26304d; --line2:#313c60; --grid:#26304d; --ring:rgba(255,255,255,.08);
  --accent:#3b6cf6; --violet:#3b6cf6; --violet2:#2f57cc;
  --accent-soft:rgba(59,108,246,.16); --accent-soft2:rgba(59,108,246,.26); --vsoft:rgba(59,108,246,.16);
  --good:#3ecf8e; --warn:#f4c430; --serious:#f0873b; --critical:#f0616e;
  --hot:#f0616e; --sky:#3b6cf6; --orange:#f0873b; --goodtext:#3ecf8e;
  --sel:rgba(59,108,246,.22); --selb:#3b6cf6;
  --shadow:0 14px 40px rgba(5,10,25,.55),0 2px 8px rgba(5,10,25,.45);
  --shadow-focus:0 22px 60px rgba(5,10,25,.7),0 3px 12px rgba(5,10,25,.5);
}


html,body{height:100%;margin:0}
body{
  font:14.5px/1.5 ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);
  background:radial-gradient(1200px 700px at 20% 0%,var(--page1),var(--page2));
  background-attachment:fixed;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:8px;border:2px solid transparent;background-clip:content-box}

#app{display:none;flex-direction:column;height:100%}
#app.on{display:flex}

/* header */
header{padding:16px 22px 0;flex:none}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.mark{width:34px;height:34px;border-radius:11px;flex:none;position:relative;overflow:hidden;
  background:linear-gradient(145deg,var(--violet),var(--violet2));
  box-shadow:0 6px 18px rgba(42,120,214,.5)}
.mark:after{content:"";position:absolute;inset:0;transform:translateX(-100%);
  background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,.5),transparent 70%);
  animation:sheen 6s var(--ease) infinite}
@keyframes sheen{0%,75%{transform:translateX(-100%)}90%,100%{transform:translateX(120%)}}
h1{margin:0;font-size:17px;letter-spacing:-.01em}
h1 small{display:block;font-size:10.5px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink3);margin-top:2px}
.grow{flex:1}
.who{font-size:12px;color:var(--ink3)}
.iconb{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--ink2);
  transition:.2s var(--spring)}
.iconb:hover{background:var(--chip);color:var(--ink);transform:scale(1.08)}

/* project rail */
.rail{display:flex;gap:8px;overflow-x:auto;padding:14px 2px 4px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.pj{flex:none;border:1px solid var(--line);background:var(--card);border-radius:13px;
  padding:9px 14px;text-align:left;transition:.22s var(--ease);min-width:118px;position:relative}
.pj:hover{border-color:var(--line2);transform:translateY(-2px)}
.pj.on{border-color:var(--violet);background:linear-gradient(180deg,rgba(42,120,214,.16),transparent);
  box-shadow:0 0 0 3px rgba(42,120,214,.14)}
.pj b{display:flex;align-items:baseline;gap:6px;font-size:13.5px;white-space:nowrap}
.pj span{font-size:10.5px;color:var(--ink3);font-variant-numeric:tabular-nums}
.pj .code{color:var(--ink);font-style:normal;font-size:9.5px;font-weight:800;color:var(--violet);letter-spacing:.06em;
  background:rgba(42,120,214,.14);border-radius:20px;padding:1px 6px;flex:none}

/* tabs */
.tabs{display:flex;gap:4px;margin-top:12px;border-bottom:1px solid var(--line)}
.tab{padding:9px 15px;font-size:13px;font-weight:650;color:var(--ink3);border-radius:10px 10px 0 0;
  position:relative;transition:.2s var(--ease)}
.tab:hover{color:var(--ink2);background:var(--chip)}
.tab.on{color:var(--ink)}
.tab.on:after{content:"";position:absolute;left:12px;right:12px;bottom:-1px;height:2px;
  background:var(--violet);border-radius:2px;box-shadow:0 0 10px var(--violet);
  animation:slide .3s var(--ease)}
@keyframes slide{from{transform:scaleX(.3)}to{transform:none}}
.tab .n{margin-left:7px;font-size:10.5px;background:var(--chip);border-radius:20px;padding:1px 7px;
  color:var(--ink3);font-variant-numeric:tabular-nums}
.tab.on .n{background:rgba(42,120,214,.25);color:var(--ink)}

/* kpis */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;padding:14px 0 4px}
.kpi{background:linear-gradient(180deg,var(--chip),var(--card2));
  border:1px solid rgba(42,120,214,.16);border-radius:14px;padding:12px 14px;
  animation:rise .45s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.kpi .k{font-size:9.5px;font-weight:750;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}
.kpi .v{font-size:25px;font-weight:700;margin:3px 0 2px;letter-spacing:-.02em;
  text-shadow:0 0 22px rgba(42,120,214,.3);font-variant-numeric:tabular-nums}
.kpi .p{font-size:11px;color:var(--ink3)}
.kpi .bar{height:4px;border-radius:4px;background:var(--chip);margin-top:8px;overflow:hidden}
.kpi .bar i{display:block;height:100%;border-radius:4px;transition:width .8s var(--ease)}

/* toolbar */
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px 0}
.f{background:var(--field);border:1px solid var(--line2);border-radius:10px;
  padding:8px 11px;outline:none;transition:.2s}
.f:focus{border-color:var(--violet);box-shadow:0 0 0 3px rgba(42,120,214,.16)}
.btn{border:1px solid var(--line2);border-radius:10px;padding:8px 13px;font-size:12.5px;
  font-weight:650;color:var(--ink2);transition:.2s var(--ease)}
.btn:hover{border-color:var(--violet);color:var(--ink);transform:translateY(-1px)}
.btn.on{background:linear-gradient(180deg,var(--violet),var(--violet2));border-color:transparent;color:#fff}
.count{margin-left:auto;font-size:12px;color:var(--ink3);font-variant-numeric:tabular-nums}

/* table */
.wrap{flex:1;overflow:auto;padding:0 22px 90px}
table.g{border-collapse:separate;border-spacing:0;font-size:12px;table-layout:fixed;width:100%}
table.g th{position:sticky;top:0;z-index:4;text-align:left;padding:6px 8px;font-size:11px;font-weight:600;color:var(--ink2);background:var(--surface2);border-bottom:1px solid var(--grid);user-select:none;cursor:pointer;white-space:nowrap}
table.g th:hover{color:var(--accent)}
table.g td{border-right:1px solid var(--grid);border-bottom:1px solid var(--grid);padding:4px 7px;text-align:left;vertical-align:top;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;background:var(--surface)}
table.g tbody tr{animation:none}
table.g.fresh tbody tr{animation:rise .35s var(--ease) both}
table.g tbody tr:nth-child(even) td{background:var(--card2)}
table.g tbody tr:hover td{background:var(--chip)}
td.mono{font-family:var(--mono);color:var(--ink)}
td.wrapc{white-space:normal;line-height:1.45;unicode-bidi:plaintext}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:20px;padding:2px 9px;
  font-size:11px;font-weight:650;white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;flex:none}

.empty{text-align:center;padding:64px 20px;color:var(--ink3)}
.empty .big{font-size:42px;margin-bottom:10px;animation:float 3.4s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:6px}

/* charts */
.panels{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;padding:4px 0}
.panel{background:linear-gradient(180deg,var(--card2),var(--card2));
  border:1px solid rgba(42,120,214,.14);border-radius:15px;padding:15px 17px}
.panel h3{margin:0 0 12px;font-size:10.5px;font-weight:750;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink2)}
.brow{display:grid;grid-template-columns:118px 1fr 62px;gap:10px;align-items:center;margin-bottom:8px}
.blab{font-size:12px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btrack{height:9px;border-radius:6px;background:var(--chip);overflow:hidden;display:flex}
.btrack i{display:block;height:100%;transition:flex .7s var(--ease);cursor:pointer}
.bnum{font-size:11.5px;color:var(--ink3);text-align:right;font-variant-numeric:tabular-nums}
.bnum b{color:var(--good);font-weight:700}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:10px;font-weight:700;
  letter-spacing:.05em;text-transform:uppercase;color:var(--ink3)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:9px;border-radius:3px;display:inline-block}

/* login */
#login{position:fixed;inset:0;z-index:80;display:none;place-items:center;padding:20px;
  background:linear-gradient(180deg,var(--page1),var(--page2))}
#login.on{display:grid}
#login .box{width:min(400px,100%);border:1px solid rgba(42,120,214,.25);border-radius:22px;padding:30px;
  background:linear-gradient(180deg,var(--surface),var(--surface));
  box-shadow:0 30px 90px rgba(42,120,214,.18);animation:rise .5s var(--ease)}
#login h2{margin:0 0 5px;font-size:21px}
#login p{margin:0 0 20px;color:var(--ink3);font-size:13px}
#login .f{width:100%;margin-bottom:10px}
#login .btn{width:100%;text-align:center;margin-top:6px;padding:11px}
#lerr{color:#fda4af;font-size:12.5px;min-height:18px;margin-top:8px}

#toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,24px);z-index:90;opacity:0;
  background:var(--surface);border:1px solid rgba(42,120,214,.3);border-radius:12px;
  padding:10px 17px;font-size:13px;pointer-events:none;transition:.32s var(--ease)}
#toast.on{opacity:1;transform:translate(-50%,0)}

@media (max-width:760px){
  header{padding:12px 14px 0}
  .wrap{padding:0 14px calc(80px + var(--safe-b))}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .tab{padding:9px 11px;font-size:12.5px}
  table.g td,table.g th{padding:7px 8px}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.06s!important}}

/* editor sheet */
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);z-index:60;display:flex;
  flex-direction:column;transform:translateX(102%);transition:transform .42s var(--ease);
  background:linear-gradient(180deg,var(--surface),var(--surface));
  border-left:1px solid rgba(42,120,214,.2);box-shadow:-30px 0 80px rgba(15,20,30,.16)}
.sheet.on{transform:none}
.sheet .sh{display:flex;align-items:center;gap:10px;padding:16px 18px;
  border-bottom:1px solid var(--line)}
.sheet .sb{flex:1;overflow:auto;padding:18px}
.fld{margin-bottom:14px}
.fld label{display:block;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink3);margin-bottom:5px}
.fld input,.fld textarea,.fld select{width:100%;background:var(--field);
  border:1px solid var(--line2);border-radius:10px;padding:9px 11px;outline:none;transition:.2s}
.fld textarea{min-height:74px;resize:vertical;line-height:1.5}
.fld input:focus,.fld textarea:focus,.fld select:focus{border-color:var(--violet);
  box-shadow:0 0 0 3px rgba(42,120,214,.16)}
.fld input:disabled,.fld textarea:disabled,.fld select:disabled{opacity:.55}

/* dialog */
#msg{position:fixed;inset:0;z-index:75;display:none;place-items:center;padding:20px;
  background:rgba(15,20,30,.16);backdrop-filter:blur(3px)}
#msg.on{display:grid}
.mbox{width:min(420px,100%);border:1px solid rgba(42,120,214,.25);border-radius:18px;padding:22px;
  background:linear-gradient(180deg,var(--surface),var(--surface));
  box-shadow:0 30px 80px rgba(15,20,30,.16);animation:rise .35s var(--ease)}
.mbox h4{margin:0 0 12px;font-size:16px}
.macts{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.dfl label{display:block;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink3);margin:10px 0 5px}
.dfl .two{display:flex;gap:10px}.dfl .two>div{flex:1}.dfl .f{width:100%}
.dpre{display:flex;flex-wrap:wrap;gap:6px}
.dpre button{border:1px solid var(--line2);background:var(--card);color:var(--ink2);
  border-radius:20px;padding:5px 11px;font:inherit;font-size:11.5px;cursor:pointer}
.dpre button:hover{border-color:var(--violet)}
.dpre button.on{background:linear-gradient(180deg,var(--violet),var(--violet2));
  border-color:transparent;color:#fff}

/* day by day */
.dayfilt{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.dayfilt button{border:1px solid var(--line2);background:var(--card);color:var(--ink2);
  border-radius:20px;padding:4px 12px;font:inherit;font-size:11.5px;font-weight:600;cursor:pointer}
.dayfilt button.on{background:linear-gradient(180deg,var(--violet),var(--violet2));
  border-color:transparent;color:#fff}
table.daily{width:100%;border-collapse:collapse;font-size:12.5px}
table.daily th{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);color:var(--ink3);
  font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
table.daily th.n,table.daily td.n{text-align:right;font-family:var(--mono)}
table.daily td{padding:6px 8px;border-bottom:1px solid var(--line);color:var(--ink2)}
table.daily td b{color:var(--ink)}
table.daily td.good{color:var(--good);font-weight:700}
table.daily td.info{color:var(--sky);font-weight:700}
table.daily th.bar,table.daily td.bar{width:30%}
table.daily td.bar i{display:block;height:6px;border-radius:4px;margin:2px 0}
table.daily td.bar i.s{background:var(--sky)} table.daily td.bar i.r{background:var(--good)}
table.daily tr.td-today td{background:var(--chip)}
.nowtag{font-size:9.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--violet);
  border:1px solid var(--violet);border-radius:10px;padding:0 6px;margin-left:5px}

/* print */
#printroot{display:none}


.hist{margin:16px 0 4px;border-top:1px solid var(--line);padding-top:14px}
.hist>label{display:block;font-size:10px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink3);margin-bottom:8px}
.hrow{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:8px 10px;margin-bottom:6px;
  background:var(--card);border:1px solid var(--line);border-radius:10px;font-size:12px}
.hrow.cur{border-color:rgba(42,120,214,.4)}
.hrow b{font-family:var(--mono);color:var(--ink)}
.hrow span{color:var(--ink2);font-family:var(--mono);font-size:11.5px}
.hrow i{margin-left:auto;color:var(--ink3);font-style:normal;font-size:11px}
.hrow .hx{color:var(--ink3);opacity:.6;font-size:12px}
.hrow .hx:hover{color:#fda4af;opacity:1}

/* ---------- desktop top bar ---------- */
#topbar{display:flex;align-items:center;gap:6px;padding:9px 18px;flex:none;
  background:linear-gradient(180deg,var(--surface),var(--field));
  border-bottom:1px solid rgba(42,120,214,.16);backdrop-filter:blur(12px)}
#topbar .mark{width:30px;height:30px;border-radius:9px}
#topbar .title{font-size:14.5px;font-weight:700;letter-spacing:-.01em;margin-right:10px}
#topbar .title small{display:block;font-size:9.5px;font-weight:700;letter-spacing:.09em;
  text-transform:uppercase;color:var(--ink3)}
.tbbtn{padding:7px 13px;border-radius:10px;font-size:13px;font-weight:650;color:var(--ink2);
  transition:.18s var(--ease);position:relative}
.tbbtn:hover{background:var(--chip);color:var(--ink)}
.tbbtn.on{color:var(--ink);background:linear-gradient(180deg,rgba(42,120,214,.2),transparent)}
.tbbtn.on:after{content:"";position:absolute;left:12px;right:12px;bottom:2px;height:2px;
  border-radius:2px;background:var(--violet);box-shadow:0 0 10px var(--violet)}
.crumb{font-size:11px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;
  color:var(--ink3);padding:12px 0 2px}

/* ---------- cards used by Plan, Overdue and More ---------- */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px;padding:4px 0}
.lcard{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--line2);
  border-radius:13px;padding:12px 14px;cursor:pointer;animation:rise .4s var(--ease) both;
  transition:transform .2s var(--ease),border-color .2s,box-shadow .2s}
.lcard:hover{transform:translateY(-2px);border-color:var(--line2);box-shadow:var(--shadow)}
.lcard.ok{border-left-color:var(--good)} .lcard.bad{border-left-color:var(--hot)}
.lc-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lc-top b{font-size:13.5px;font-family:var(--mono);color:var(--ink)}
.tagk{font-size:9.5px;font-weight:750;letter-spacing:.07em;text-transform:uppercase;
  color:var(--ink3);background:var(--chip);border-radius:20px;padding:2px 8px}
.lc-top .late{margin-left:auto;color:var(--hot);font-size:11.5px;font-weight:700}
.lc-top .ok{margin-left:auto;color:var(--good);font-size:11.5px;font-weight:700}
.lc-top .due{margin-left:auto;color:var(--sky);font-size:11.5px;font-weight:700}
.lc-what{font-size:13px;color:var(--ink2);margin-top:6px;line-height:1.45}
.lc-meta{font-size:11.5px;color:var(--ink3);margin-top:6px}

/* ---------- plan ---------- */
.planbar{display:flex;align-items:center;gap:9px;padding:4px 0 12px}
.planbar .wk{text-align:center;min-width:170px}
.planbar .wk b{display:block;font-size:14px}
.planbar .wk span{font-size:11px;color:var(--ink3)}
.planprog{background:linear-gradient(180deg,var(--chip),var(--card2));
  border:1px solid rgba(42,120,214,.16);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.pnum{display:flex;align-items:baseline;gap:10px}
.pnum b{font-size:26px;letter-spacing:-.02em}
.pnum span{color:var(--ink3);font-size:12.5px}
.ptrack{height:7px;border-radius:5px;background:var(--chip);margin:10px 0 8px;overflow:hidden}
.ptrack i{display:block;height:100%;border-radius:5px;
  background:linear-gradient(90deg,var(--violet),var(--good));transition:width .8s var(--ease)}
.pleg{display:flex;gap:14px;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.pleg .g{color:var(--good)} .pleg .r{color:var(--hot)} .pleg .n{color:var(--ink3)}

/* ---------- phone tab bar ---------- */

<script>
const SB_URL='https://ivmmnsjiekhjxkhllncb.supabase.co';
const SB_KEY='sb_publishable_RTHsaxZXVmRBQziLbFJX8g_PAaZzIbF';
const BUILD='ENG 2026-09-06 · e65';

let SESSION=null, ME=null;
let PROJECTS=[], PEOPLE=[], AB=[], SD=[], GIS=[], HIST=[], INV=[];
let PROJ=null, TAB='shop', Q='', F='', SORT={k:'submittal_no',dir:1};

const isoDay=d=>{const x=(d instanceof Date)?d:new Date(d);
  return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+
         String(x.getDate()).padStart(2,'0');};
const today=isoDay(new Date());
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=id=>document.getElementById(id);
/* While a window is drawing, everything the painters write into #wrap goes
   into that window's body instead. One switch, so every existing view works
   inside a window with no other change. */
let PAINT_TARGET=null;
const $wrap=()=>PAINT_TARGET||document.getElementById('wrap');

async function api(path,opts={},tries=0){
  const r=await fetch(SB_URL+'/rest/v1/'+path,{...opts,headers:{
    apikey:SB_KEY,Authorization:'Bearer '+(SESSION?SESSION.access_token:SB_KEY),
    'Content-Type':'application/json',Prefer:'return=representation',...(opts.headers||{})}});
  if(r.ok){const t=await r.text();return t?JSON.parse(t):null;}
  const body=await r.text();
  /* the sign-in server can mint a token a moment ahead of the database clock */
  if(/PGRST303|issued at future/.test(body)&&tries<4){
    await new Promise(res=>setTimeout(res,900+tries*700));
    return api(path,opts,tries+1);
  }
  if(r.status===401&&tries<1&&await resume())return api(path,opts,tries+1);
  throw new Error(readable(body,r.status));
}
function readable(body,status){
  try{const j=JSON.parse(body);
    if(/issued at future/.test(j.message||''))
      return 'This device’s clock is out of step with the server. Check date and time, then try again.';
    if(j.message)return j.message;}catch(e){}
  return body.slice(0,120)||('Request failed ('+status+')');
}
const save=()=>{try{localStorage.setItem('eng-session',JSON.stringify(SESSION));}catch(e){}};
async function resume(){
  let s=null;try{s=JSON.parse(localStorage.getItem('eng-session')||'null');}catch(e){}
  if(!s||!s.refresh_token)return false;
  const r=await fetch(SB_URL+'/auth/v1/token?grant_type=refresh_token',{method:'POST',
    headers:{apikey:SB_KEY,'Content-Type':'application/json'},
    body:JSON.stringify({refresh_token:s.refresh_token})});
  if(!r.ok)return false;
  SESSION=await r.json();save();return true;
}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');
  clearTimeout(t._x);t._x=setTimeout(()=>t.classList.remove('on'),3000);}

/* The database returns at most 1000 rows per request whatever limit is asked
   for, so anything that can grow past that must be fetched page by page —
   otherwise the register quietly shows part of the data and looks correct. */
const PAGE=1000;
async function apiAll(path){
  let out=[], from=0;
  for(let guard=0; guard<40; guard++){
    const part=await api(path,{headers:{Range:from+'-'+(from+PAGE-1),
      'Range-Unit':'items',Prefer:'count=none'}});
    const got=part||[];
    out=out.concat(got);
    if(got.length<PAGE)break;
    from+=PAGE;
  }
  return out;
}

/* ---------- loading ---------- */
async function loadAll(){
  const [pr,pe,ab,sd,gi,me,hs,iv]=await Promise.all([
    api('eng_projects?order=seq.asc'),
    api('eng_people?order=name.asc'),
    apiAll('eng_asbuilts?deleted_at=is.null&order=id.asc'),
    apiAll('eng_shopdrawings?deleted_at=is.null&order=id.asc'),
    apiAll('eng_gis?deleted_at=is.null&order=id.asc'),
    api('eng_members?select=name,role&limit=1'),
    apiAll('eng_history?order=id.asc'),
    apiAll('eng_invoice_sections?deleted_at=is.null&order=id.asc')]);
  PROJECTS=pr||[];PEOPLE=pe||[];AB=ab||[];SD=sd||[];GIS=gi||[];
  ME=(me&&me[0])||null; HIST=hs||[]; INV=iv||[];
}

/* ---------- helpers ---------- */
const byProj = rows => PROJ ? rows.filter(r=>r.project_id===PROJ) : rows;
const abFor  = () => byProj(AB);
const sdFor  = () => byProj(SD);
const invFor = () => byProj(INV);
const gisFor = () => byProj(GIS);
const personName = id => (PEOPLE.find(p=>p.id===id)||{}).name || '';
const projName   = id => (PROJECTS.find(p=>p.id===id)||{}).name || '—';
const projCode   = id => (PROJECTS.find(p=>p.id===id)||{}).code || '';

const AB_DONE  = s => s==='Submitted';
/* the Client has accepted it, with or without exceptions */
const GIS_OK   = s => s==='Code A' || s==='Code B' || s==='Deemed'
                   || s==='Approved' || s==='Approved As Noted';
const GIS_BAD  = s => s==='Rejected' || s==='Revise & Resubmit';


/* ---- Ma'aden's review codes -------------------------------------------
   The Client stamps A, C, R or I — there is no "B" in their scheme, so what
   an AWPT workbook calls Code B is their C. The same wording and colours as
   the LOD tracker, so a drawing reads the same in both apps. */
const MAADEN_GRADE={
  'Code A':            {g:'A', t:'Accepted',                d:'accepted'},
  'Code B':            {g:'C', t:'Proceed with exceptions', d:'proceed with exceptions to the next submission and revision'},
  'Rejected':          {g:'R', t:'Do not proceed',          d:'revise as noted and resubmit'},
  'Replied':           {g:'I', t:'For information',         d:'issued to the Client for information'},
  'Deemed':            {g:'A', t:'Deemed accepted',         d:'no reply within 10 working days'},
  'Under Client review':{g:'', t:'Under Client review',     d:'with Ma\'aden, awaiting their stamp'},
  'On hold':           {g:'',  t:'On hold',                 d:'held pending a prerequisite'},
  /* the words this app already uses, carrying the Client's own stamp, so a
     register loaded from an AWPT workbook still reads in Ma'aden's terms */
  'Approved':          {g:'A', t:'Accepted',                d:'accepted — Code A'},
  'Approved As Noted': {g:'C', t:'Proceed with exceptions', d:'proceed with exceptions to the next submission and revision — Code B/C'},
  'Revise & Resubmit': {g:'R', t:'Do not proceed',          d:'revise as noted and resubmit'},
  'For Information':   {g:'I', t:'For information',         d:'issued for information'},
  'Under Review':      {g:'',  t:'Under review',            d:'submitted, awaiting the reviewer'},
  'Not Submitted':     {g:'',  t:'Not submitted',           d:'no submission yet'},
  'Pending NWC':       {g:'',  t:'Pending NWC',             d:'waiting on NWC'},
  'Withdrawn':         {g:'',  t:'Withdrawn',               d:'withdrawn'}
};
const MAADEN_CODES=['Code A','Code B','Rejected','Replied','Deemed',
                    'Under Client review','On hold'];
const maadenLabel=v=>{ const m=MAADEN_GRADE[v];
  return m ? (m.g?m.g+' — '+m.t:m.t) : (v||''); };

const pill = (s,row) => { if(!s)return '';
  /* the Client's letter only where the Client is Ma'aden */
  const maaden = row ? projectClient(row.project_id)==='Maaden'
                     : (PROJ!=null && projectClient(PROJ)==='Maaden');
  const col=SCOL[s]||'var(--chip)', m=maaden?MAADEN_GRADE[s]:null;
  /* the badge already carries the letter, so the words beside it are just
     the meaning — "A  Accepted", not "A  A — Accepted" */
  const text=m?(m.g?m.t:m.t):s;
  return `<span class="pill" title="${esc(m?m.d:s)}" style="background:${col}22;color:${col}">
    ${m&&m.g?`<b class="grade" style="background:${col}">${m.g}</b>`
            :`<i class="dot" style="background:${col}"></i>`}${esc(text)}</span>`; };

function rowsNow(){
  /* a card on the dashboard filters the register to that state */
  if(RSTATE){
    const sp=regSplit(TAB).rows.find(x=>x.k===RSTATE);
    if(sp){ const base=rowsOf(TAB), seen=new Set();
      const order=regSplit(TAB).rows;
      return base.filter(r=>{ for(const x of order){ if(!seen.has(r.id)&&x.f(r)){ seen.add(r.id);
        return x.k===RSTATE; } } return false; }); }
  }
  let rows = TAB==='gis'?gisFor()
           : TAB==='shop'?sdFor() : TAB==='invoice'?invFor() : abFor();
  /* the column filters set from the right-click menu */
  const _fc=COLS[TAB]||[];
  Object.keys(CFILT).forEach(k=>{
    const set=CFILT[k]; if(!set||!set.length)return;
    const c=_fc.find(x=>x.k===k); if(!c)return;
    rows=rows.filter(r=>set.includes(cellText(r,c)));
  });
  if(F==='open'){
    rows = TAB==='invoice'  ? rows.filter(r=>r.status!=='Submitted')
         : TAB==='asbuilts' ? rows.filter(r=>!AB_DONE(r.status))
         : rows.filter(r=>!GIS_OK(r.review_status));
  } else if(F==='done'){
    rows = TAB==='invoice'  ? rows.filter(r=>r.status==='Submitted')
         : TAB==='asbuilts' ? rows.filter(r=>AB_DONE(r.status))
         : rows.filter(r=>GIS_OK(r.review_status));
  }
  if(DRILL&&DRILL.tab===TAB)rows=rows.filter(drillMatch);
  if(DF.field&&(DF.from||DF.to)){
    rows=rows.filter(r=>{const v=r[DF.field]||'';
      if(!v)return false;
      if(DF.from&&v<DF.from)return false;
      if(DF.to&&v>DF.to)return false;
      return true;});
  }
  if(Q){
    const q=Q.toLowerCase();
    rows = rows.filter(r=>Object.values(r).some(v=>String(v??'').toLowerCase().includes(q)));
  }
  const c=(COLS[TAB]||[]).find(x=>x.k===SORT.k);
  return rows.slice().sort((a,b)=>{
    const va=c&&c.calc?c.calc(a):(a[SORT.k]??''), vb=c&&c.calc?c.calc(b):(b[SORT.k]??'');
    const ea=String(va).trim()==='', eb=String(vb).trim()==='';
    if(ea!==eb)return ea?1:-1;
    const na=parseFloat(va),nb=parseFloat(vb);
    if(!isNaN(na)&&!isNaN(nb))return (na-nb)*SORT.dir;
    return String(va).localeCompare(String(vb))*SORT.dir;
  });
}

const DONEFN={
  shop:   r=>GIS_OK(r.review_status),
  gis:    r=>GIS_OK(r.review_status),

function drillMatch(r){
  if(!DRILL)return true;
  const f=DRILL.field;
  const got = f==='project_id' ? r.project_id
            : (r[f]===null||r[f]===undefined?'':r[f]);
  if(String(got)!==String(DRILL.value))return false;
  if(DRILL.state==='done')return DONEFN[DRILL.tab](r);
  if(DRILL.state==='open')return !DONEFN[DRILL.tab](r);
  return true;
}
function goDrill(tab,field,value,state,label){
  DRILL={tab,field,value,state,label};
  TAB=tab; VIEW='reg'; F=''; Q=''; DF={field:'',from:'',to:''};
  loadColPref(); loadCFilt();
  paint();
  const w=$wrap(); if(w)w.scrollTop=0;
  const n=rowsNow().length;
  toast(n+' record'+(n===1?'':'s')+' · '+label);
}

function rowsOf(tab){ return tab==='gis'?gisFor()

function openSheet(id){

                 :'<span class="who">read only</span>'}</div>
    <div class="sb">${fields.map(([k,label,type,opts])=>{
      const v=row[k]??'';
      /* say whose scheme this is, so it is obvious which list you are getting */
      if(k==='review_status'&&projectClient(row.project_id)==='Maaden')
        label=label+" · Ma'aden";
      const dis=canEdit()?'':' disabled';
      const input =
        type==='area' ? `<textarea id="f-${k}"${dis}>${esc(v)}</textarea>`
      : type==='sel'  ? (()=>{ /* worked out now, so it follows this project's client */
            const list=liveOptions(k,opts,row);
            const extra=(v&&!list.includes(v))?[v]:[];
            const maaden=projectClient(row.project_id)==='Maaden';
            const show=o=>o===''?'— none —':((maaden&&MAADEN_GRADE[o])?maadenLabel(o):o);
            return `<select id="f-${k}"${dis}>${['',...list,...extra].map(o=>
              `<option value="${esc(o)}"${String(v)===o?' selected':''}>${esc(show(o))}</option>`
              ).join('')}</select>`; })()
      : type==='date' ? `<input id="f-${k}" type="date" value="${esc(v)}"${dis}>`
      : type==='num'  ? `<input id="f-${k}" type="number" value="${esc(v)}"${dis}>`
      : (()=>{ const ch=colChoices(k);
          if(!ch.length)return `<input id="f-${k}" value="${esc(v)}"${dis}>`;
          const known=ch.includes(String(v));
          return `<select id="f-${k}" data-combo="${k}"${dis}>
            <option value=""${v===''?' selected':''}>— none —</option>
            ${ch.map(o=>`<option${String(v)===o?' selected':''}>${esc(o)}</option>`).join('')}
            ${(!known&&v!=='')?`<option selected>${esc(v)}</option>`:''}
            <option value="__new">＋ something else…</option></select>`;
        })();
      return `<div class="fld"><label>${esc(label)}</label>${input}</div>`;}).join('')}
      <div class="fld"><label>Project</label>
        <select id="f-project_id"${canEdit()?'':' disabled'}>
          <option value="">— none —</option>${PROJECTS.map(p=>
          `<option value="${p.id}"${row.project_id===p.id?' selected':''}>${esc(p.name)}</option>`).join('')}</select></div>
      ${KIND[TAB]?historyHTML(KIND[TAB],row.id):''}
      <div class="hint" style="color:var(--ink3);font-size:11.5px">Changes save as you leave each box.</div>
    </div>`;
  sh.classList.add('on');
  document.getElementById('shx').onclick=()=>{sh.classList.remove('on');};
  const dl=document.getElementById('shdel');
  if(dl)dl.onclick=()=>deleteRecord(row.id);
  const lg=document.getElementById('logcy');
  if(lg)lg.onclick=()=>logCycle(KIND[TAB],row.id);
  sh.querySelectorAll('[data-del]').forEach(b=>b.onclick=async e=>{
    e.stopPropagation(); const hid=+b.dataset.del;
    try{ await api('eng_history?id=eq.'+hid,{method:'DELETE'});
      HIST=HIST.filter(h=>h.id!==hid); await reloadRecord(KIND[TAB],row.id);
      toast('Cycle removed'); }catch(err){ toast(err.message); }
  });
  if(!canEdit())return;
  const _attach=(k,el)=>{
    if(!el)return;
    /* the same growing list of choices as the grid */
    if(el.tagName==='INPUT'&&(el.type==='text'||!el.type)&&colChoices(k).length){
      el.setAttribute('list',datalistFor(k));
      el.setAttribute('autocomplete','off');

    el.onchange=async()=>{
      let val=el.value;
      if(k==='project_id')val=val?+val:null;
      if(k==='revision'||k==='last_revision')val=val===''?null:+val;

        {method:'PATCH',body:JSON.stringify({[k]:val})});
        toast('Saved'); }
      catch(e){ row[k]=before; paintTable(); toast(e.message); }
    };
  };
  window._rewireField=(k,el)=>_attach(k,el);
  fields.concat([['project_id','','sel']]).forEach(([k])=>
    _attach(k,document.getElementById('f-'+k)));
  wireCombos(document.getElementById('sheet'));
}

/* ---------- filter by a date range ---------- */
function openDateFilter(){
  const cols=DATECOLS[TAB]||[];
  if(!cols.length)return toast('This register has no dates to filter on');
  const shift=n=>{const d=new Date(today+'T00:00:00');d.setDate(d.getDate()+n);return isoDay(d);};
  const presets=[['Today',today,today],['Last 7 days',shift(-6),today],
    ['Last 30 days',shift(-29),today],['This month',today.slice(0,8)+'01',today],
    ['Next 7 days',today,shift(6)],['Before today','',shift(-1)]];
  const dlg=msgBox('Filter by date',
    `<div class="dfl"><label>Which date</label>
      <select class="f" id="dff">${cols.map(([k,l])=>
        `<option value="${k}"${DF.field===k?' selected':''}>${esc(l)}</option>`).join('')}</select>
      <div class="two"><div><label>From</label><input class="f" type="date" id="dfa" value="${esc(DF.from)}"></div>
      <div><label>To</label><input class="f" type="date" id="dfb" value="${esc(DF.to)}"></div></div>
      <label>Or pick a period</label>
      <div class="dpre">${presets.map(([l,a,b])=>
        `<button data-a="${a}" data-b="${b}">${l}</button>`).join('')}</div>
      <div style="color:var(--ink3);font-size:11.5px;margin-top:8px">
        Records with no date in that column are left out while a range is set.</div></div>`,
    [['Clear',()=>{DF={field:'',from:'',to:''};paint();},''],
     ['Apply',()=>{DF={field:document.getElementById('dff').value,
        from:document.getElementById('dfa').value,to:document.getElementById('dfb').value};
        paint(); toast(rowsNow().length+' records in that period');},'on']]);
  dlg.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{
    dlg.querySelector('#dfa').value=b.dataset.a;
    dlg.querySelector('#dfb').value=b.dataset.b;
    dlg.querySelectorAll('[data-a]').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');});
}
function msgBox(title,body,acts){
  let m=document.getElementById('msg');
  if(!m){m=document.createElement('div');m.id='msg';document.body.appendChild(m);}
  m.innerHTML=`<div class="mbox"><h4>${esc(title)}</h4><div class="mb">${body}</div>
    <div class="macts">${acts.map(([l,,cls],i)=>
      `<button class="btn ${cls||''}" data-i="${i}">${esc(l)}</button>`).join('')}</div></div>`;
  m.classList.add('on');
  m.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{
    const fn=acts[+b.dataset.i][1]; m.classList.remove('on'); if(fn)fn();});
  return m;
}

/* ---------- day by day ---------- */
let DAYS_BACK=14;
function dailyPanel(){
  const cols=DATECOLS[TAB]||DATECOLS.shop;
  const rows=[];
  const src = (VIEW==='dash') ? sdFor() : rowsOf(TAB);
  const subK='submitted_date', recK='received_date';
  for(let i=0;i<DAYS_BACK;i++){
    const d=new Date(today+'T00:00:00'); d.setDate(d.getDate()-i);
    const k=isoDay(d);
    rows.push({k,d,out:src.filter(r=>r[subK]===k).length,
                 back:src.filter(r=>r[recK]===k).length});
  }
  const any=rows.some(r=>r.out||r.back);
  const best=Math.max(1,...rows.map(r=>Math.max(r.out,r.back)));
  const fmt=d=>d.toLocaleDateString('en-GB',{weekday:'short',day:'2-digit',month:'short'});
  return `<div class="panel"><h3>Day by day — submitted and returned</h3>
    <div class="dayfilt">${[7,14,30,60].map(n=>
      `<button data-days="${n}" class="${DAYS_BACK===n?'on':''}">${n} days</button>`).join('')}</div>
    <table class="daily"><thead><tr><th>Day</th>
      <th class="n">Submitted</th><th class="n">Returned</th><th class="bar"></th></tr></thead>
    <tbody>${rows.map(r=>`<tr${r.k===today?' class="td-today"':''}>
      <td><b>${fmt(r.d)}</b>${r.k===today?' <span class="nowtag">today</span>':''}</td>
      <td class="n ${r.out?'info':''}">${r.out||'—'}</td>
      <td class="n ${r.back?'good':''}">${r.back||'—'}</td>
      <td class="bar"><i class="s" style="width:${r.out/best*100}%"></i>
        <i class="r" style="width:${r.back/best*100}%"></i></td></tr>`).join('')}
    </tbody></table>
    ${any?'':'<div style="color:var(--ink3);font-size:12px;padding:8px 2px">Nothing moved in this window.</div>'}
  </div>`;
}

/* ---------- printable report ---------- */
function exportPDF(){
  const cols=(COLS[TAB]||[]).filter(c=>!c.wrap||c.k==='description').slice(0,9);
  const rows=rowsNow();
  if(!rows.length)return toast('Nothing to print with those filters');
  let root=document.getElementById('printroot');
  if(!root){root=document.createElement('div');root.id='printroot';document.body.appendChild(root);}
  const label=(TABS.find(t=>t.k===TAB)||{}).t||'';
  /* a column every row leaves blank wastes a strip of the page, so it is left
     out of the printed report */
  const used=cols.filter(c=>rows.some(r=>{
    const v=c.calc?c.calc(r):r[c.k];
    return v!==null&&v!==undefined&&String(v).trim()!=='';
  }));
  const shown=used.length?used:cols;
  /* the widths: the description takes what is left, the short ones stay short */
  const WIDE={description:26,doc_no:15,submittal_no:11,zone:8,discipline:8,review_status:9,
              planned_date:7,submitted_date:7,received_date:7,last_revision:4,
              owner_id:8,project_id:10,cycles:4};
  const weights=shown.map(c=>WIDE[c.k]||9);
  const total=weights.reduce((a,b)=>a+b,0);
  const when=new Date().toLocaleString('en-GB',{day:'2-digit',month:'short',year:'numeric',
    hour:'2-digit',minute:'2-digit'});
  const dropped=cols.length-shown.length;
  root.innerHTML=`<div class="rhead">
      <div><h1>${esc(label)}${PROJ?' — '+esc(projName(PROJ)):''}</h1>
        <div class="rsub">${rows.length} record${rows.length===1?'':'s'}${

/* ---------- submission history ---------- */
const KIND={asbuilts:'asbuilt',shop:'shop',gis:'gis'};
const cyclesOf=(kind,id)=>HIST.filter(h=>h.kind===kind&&h.record_id===id)
  .sort((a,b)=>(parseFloat(String(a.revision).replace(/\D/g,''))||0)
              -(parseFloat(String(b.revision).replace(/\D/g,''))||0)||a.id-b.id);
function historyHTML(kind,id){
  const cy=cyclesOf(kind,id);
  return `<div class="hist"><label>Submission history</label>
    ${cy.length?cy.map((h,i)=>{
      const days=(h.submitted&&h.received)
        ? Math.round((new Date(h.received)-new Date(h.submitted))/864e5) : null;
      return `<div class="hrow${i===cy.length-1?' cur':''}" data-h="${h.id}">
        <b>Rev ${esc(h.revision)}</b>
        <span>${h.submitted?esc(h.submitted):'—'} → ${h.received?esc(h.received):'with the reviewer'}</span>
        ${h.outcome?pill(h.outcome):''}
        ${days!==null?`<i>${days}d</i>`:''}
        ${canEdit()?`<button class="hx" data-del="${h.id}" title="Remove">✕</button>`:''}
      </div>`;}).join('')
      :'<div style="color:var(--ink3);font-size:12px;padding:6px 0">No cycles recorded yet.</div>'}
    ${canEdit()?`<button class="btn" id="logcy" style="margin-top:8px">Log a submission</button>`:''}
  </div>`;
}
function logCycle(kind,id){
  const cy=cyclesOf(kind,id);
  const next=cy.length
    ? String((parseFloat(String(cy[cy.length-1].revision).replace(/\D/g,''))||0)+1) : '0';
  const dlg=msgBox('Log a submission',
    `<div class="dfl"><label>Revision</label><input class="f" id="cr" value="${next}">
      <div class="two"><div><label>Sent</label><input class="f" type="date" id="cs" value="${today}"></div>
      <div><label>Replied</label><input class="f" type="date" id="cc"></div></div>
      <label>Outcome</label>
      <select class="f" id="co"><option value="">— still with the reviewer —</option>
        ${REVIEW.filter(r=>r!=='Not Submitted').map(r=>`<option>${esc(r)}</option>`).join('')}</select>
      <div style="color:var(--ink3);font-size:11.5px;margin-top:8px">
        The record takes its dates and status from the newest cycle.</div></div>`,
    [['Cancel',null,''],['Save',async()=>{
      const body={kind,record_id:id,
        revision:dlg.querySelector('#cr').value.trim()||next,
        submitted:dlg.querySelector('#cs').value,
        received:dlg.querySelector('#cc').value,
        outcome:dlg.querySelector('#co').value,
        actor:(ME&&ME.name)||''};
      try{
        const made=await api('eng_history',{method:'POST',body:JSON.stringify(body)});
        if(made&&made[0])HIST.push(made[0]);
        await reloadRecord(kind,id);
        toast('Submission logged');
      }catch(e){ toast(e.message); }
    },'on']]);
}
async function reloadRecord(kind,id){
  const table = kind==='shop'?'eng_shopdrawings':kind==='gis'?'eng_gis':'eng_asbuilts';
  const list  = kind==='shop'?SD:kind==='gis'?GIS:AB;
  try{
    const fresh=await api(table+'?id=eq.'+id);
    if(fresh&&fresh[0]){const i=list.findIndex(r=>r.id===id); if(i>=0)Object.assign(list[i],fresh[0]);}
  }catch(e){}
  paint(); openSheet(id);
}

/* ---------- Plan: what is meant to go out, week by week ---------- */
let WEEK=0;
function weekStart(off){
  const d=new Date(today+'T00:00:00');
  d.setDate(d.getDate()-((d.getDay()+1)%7)+off*7);   /* weeks run Sunday to Saturday */
  return isoDay(d);
}
function paintPlan(){
  const from=weekStart(WEEK), to=(()=>{const d=new Date(from+'T00:00:00');
    d.setDate(d.getDate()+6);return isoDay(d);})();
  const inWeek=r=>r.planned_date>=from&&r.planned_date<=to;
  const items=[...sdFor().filter(r=>r.planned_date&&inWeek(r)).map(r=>({...r,kind:'Shop drawing',tab:'shop'})),
               ...gisFor().filter(r=>r.planned_date&&inWeek(r)).map(r=>({...r,kind:'GIS',tab:'gis'}))]
    .sort((a,b)=>a.planned_date<b.planned_date?-1:1);
  const done=items.filter(r=>r.submitted_date&&r.submitted_date<=to).length;
  const late=items.filter(r=>!r.submitted_date&&r.planned_date<today).length;
  const pct=items.length?Math.round(done/items.length*100):0;
  const fmt=d=>new Date(d+'T00:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short'});
  $wrap().innerHTML=`
    <div class="planbar">
      <button class="btn" id="wprev">‹</button>
      <div class="wk"><b>${fmt(from)} – ${fmt(to)}</b>
        <span>${WEEK===0?'this week':WEEK===1?'next week':WEEK===-1?'last week'
          :(WEEK>0?WEEK+' weeks ahead':(-WEEK)+' weeks back')}</span></div>
      <button class="btn" id="wnext">›</button>
      <button class="btn" id="wnow">Today</button>
    </div>
    <div class="planprog"><div class="pnum"><b>${pct}%</b>
        <span>${done} of ${items.length} sent</span></div>
      <div class="ptrack"><i style="width:${pct}%"></i></div>
      <div class="pleg"><span class="g">${done} sent</span>
        <span class="r">${late} overdue</span>
        <span class="n">${items.length-done-late} still to come</span></div></div>
    ${items.length?`<div class="cards">${items.map((r,i)=>{
      const sent=!!r.submitted_date, isLate=!sent&&r.planned_date<today;
      return `<article class="lcard ${sent?'ok':isLate?'bad':''}" data-go="${r.tab}:${r.id}"
          style="animation-delay:${Math.min(i,14)*24}ms">
        <div class="lc-top"><span class="tagk">${esc(r.kind)}</span>
          <b>${esc(r.submittal_no||r.description)}</b>
          <span class="${sent?'ok':isLate?'late':'due'}">${
            sent?'sent '+esc(r.submitted_date):isLate?daysLate(r.planned_date)+'d late':'due '+esc(r.planned_date)}</span></div>
        <div class="lc-what">${esc(r.description||'')}</div>
        <div class="lc-meta">${esc(projName(r.project_id))} · ${esc(r.review_status)}</div>
      </article>`;}).join('')}</div>`
    :`<div class="empty"><div class="big">📅</div><b>Nothing planned for this week</b>
      Planned dates come from the drawings themselves — set one and it appears here.</div>`}`;
  $('wprev').onclick=()=>{WEEK--;paintPlan();};
  $('wnext').onclick=()=>{WEEK++;paintPlan();};
  $('wnow').onclick=()=>{WEEK=0;paintPlan();};
  $wrap().querySelectorAll('[data-go]').forEach(el=>el.onclick=()=>{
    const [tab,id]=el.dataset.go.split(':');
    TAB=tab; VIEW='reg'; paint(); openSheet(+id);});
}

function saveColPref(){ try{ localStorage.setItem('eng_cols_'+TAB,JSON.stringify(COLPREF)); }catch(e){} }

/* ---- per-column filters -------------------------------------------------
   Right-click a heading and choose Filter: every value in that column, with
   a count, ticked or not. Kept per register, so the Shop Drawings filters do
   not follow you to Invoices. */
let CFILT={};
function loadCFilt(){ try{ CFILT=JSON.parse(localStorage.getItem('eng_filt_'+TAB)||'{}'); }
  catch(e){ CFILT={}; } }
function saveCFilt(){ try{ localStorage.setItem('eng_filt_'+TAB,JSON.stringify(CFILT)); }catch(e){} }
function cellText(r,c){
  const v=c.calc?c.calc(r):r[c.k];
  return (v===null||v===undefined||v==='')?'':String(v);
}
/* the rows a column filter would leave, ignoring that column's own filter so
   the list still shows everything you could tick */
function rowsForFilter(exceptKey){
  const cols=COLS[TAB]||[];
  return rowsOf(TAB).filter(r=>{
    for(const k in CFILT){
      if(k===exceptKey)continue;
      const set=CFILT[k]; if(!set||!set.length)continue;
      const c=cols.find(x=>x.k===k); if(!c)continue;
      if(!set.includes(cellText(r,c)))return false;
    }
    return true;
  });
}

/* is anything narrowing the register at the moment? */
function anyFilter(){
  return !!(Q || (F&&F!=='') || DF.from || DF.to || RSTATE ||
            Object.keys(CFILT||{}).some(k=>(CFILT[k]||[]).length));
}
/* what the Clear button will undo, named on its tooltip */
function filterSummary(){
  const bits=[];
  if(Q)bits.push('search "'+Q+'"');
  if(F)bits.push(F==='open'?'not approved':F==='done'?'approved':F);
  if(DF.from||DF.to)bits.push('dates '+(DF.from||'…')+' → '+(DF.to||'…'));
  if(RSTATE)bits.push('a state picked on the dashboard');
  const cols=COLS[TAB]||[];
  Object.keys(CFILT||{}).forEach(k=>{
    if(!(CFILT[k]||[]).length)return;
    const c=cols.find(x=>x.k===k);
    bits.push((c?c.t:k)+' ('+CFILT[k].length+')');
  });
  return bits.length?('Clears: '+bits.join(' · ')):'Nothing is filtered';
}
function clearAllFilters(){
  Q=''; F=''; DF={field:'',from:'',to:''}; RSTATE='';
  CFILT={}; saveCFilt();
  paint(); if(typeof redrawWins==='function')redrawWins();
  toast('Filters cleared');
}

function colFilterBox(k,cols){
  const c=cols.find(x=>x.k===k); if(!c)return;
  const rows=rowsForFilter(k);
  const counts=new Map();
  rows.forEach(r=>{ const t=cellText(r,c); counts.set(t,(counts.get(t)||0)+1); });
  const vals=[...counts.keys()].sort((a,b)=>
    (a===''?1:b===''?-1:0) || String(a).localeCompare(String(b),undefined,{numeric:true}));
  const on=CFILT[k]||null;                 /* null means everything */
  const list=vals.map((v,i)=>
    `<label class="frow"><input type="checkbox" data-v="${esc(v)}" ${
      (!on||on.includes(v))?'checked':''}>
      <span class="ft">${v===''?'<i>(blank)</i>':esc(v)}</span>
      <span class="fn">${counts.get(v)}</span></label>`).join('');
  msgBox('Filter · '+c.t,
    `<input class="f" id="fsearch" placeholder="Search these values…" style="margin-bottom:8px">
     <div class="fbtns">
       <button class="btn" id="fall">Select all</button>
       <button class="btn" id="fnone">Clear</button>
       <button class="btn" id="finv">Invert</button>
     </div>
     <div class="flist" id="flist">${list}</div>
     <div class="hint" id="fcount"></div>`,
    [['Cancel',null,''],['Apply',()=>{
        const boxes=[...document.querySelectorAll('#flist input')];
        const picked=boxes.filter(b=>b.checked).map(b=>b.dataset.v);
        if(picked.length===boxes.length)delete CFILT[k]; else CFILT[k]=picked;
        saveCFilt(); paint(); if(typeof redrawWins==='function')redrawWins();
      },'primary']]);
  const m=document.getElementById('msg');
  const upd=()=>{
    const b=[...m.querySelectorAll('#flist input')];
    const n=b.filter(x=>x.checked).length;
    m.querySelector('#fcount').textContent=n+' of '+b.length+' values shown';
  };
  m.querySelector('#fsearch').oninput=e=>{
    const q=e.target.value.toLowerCase();
    m.querySelectorAll('#flist .frow').forEach(el=>{
      el.style.display=el.textContent.toLowerCase().includes(q)?'':'none';});
  };
  m.querySelector('#fall').onclick=()=>{ m.querySelectorAll('#flist input').forEach(b=>b.checked=true); upd(); };
  m.querySelector('#fnone').onclick=()=>{ m.querySelectorAll('#flist input').forEach(b=>b.checked=false); upd(); };
  m.querySelector('#finv').onclick=()=>{ m.querySelectorAll('#flist input').forEach(b=>b.checked=!b.checked); upd(); };
  m.querySelectorAll('#flist input').forEach(b=>b.onchange=upd);
  upd();
}

function colMenu(ev,k,cols){
  ev.preventDefault(); ev.stopPropagation(); closeColMenu();
  const i=cols.findIndex(c=>c.k===k); if(i<0)return;
  const col=cols[i], fz=COLPREF.freeze||0;
  const item=(a,hint,off)=>
    `<button data-a="${esc(a)}"${off?' disabled':''}>${esc(a)}<span class="kb">${esc(hint||'')}</span></button>`;
  const m=document.createElement('div');
  m.className='ctxmenu';
  m.innerHTML=`<div class="hd">${esc(col.t)}</div>`+
    item('Sort A to Z', SORT.k===k&&SORT.dir>0?'▲ on':'▲')+
    item('Sort Z to A', SORT.k===k&&SORT.dir<0?'▼ on':'▼')+'<hr>'+
    item('Filter…', (CFILT[k]&&CFILT[k].length)?'on':'')+
    item('Clear this filter','',!(CFILT[k]&&CFILT[k].length))+
    item('Clear every filter','',!Object.keys(CFILT).length)+'<hr>'+
    item('Move left','←',i===0)+
    item('Move right','→',i===cols.length-1)+
    item('Move to the front','',i===0)+'<hr>'+
    item('Freeze up to this column', fz===i+1?'on':'')+
    item('Unfreeze all','',!fz)+'<hr>'+
    item('Reset the width','',!COLPREF.w[k])+
    item('Hide this column','',cols.length<2)+
    item('Show every column','',!(COLPREF.hidden||[]).length);
  document.body.appendChild(m);
  const r=m.getBoundingClientRect();
  m.style.left=Math.min(ev.clientX, innerWidth-r.width-8)+'px';
  m.style.top=Math.min(ev.clientY, innerHeight-r.height-8)+'px';
  _ctx=m;
  m.addEventListener('click',e=>e.stopPropagation());
  m.querySelectorAll('button').forEach(b=>b.onclick=()=>{
    const a=b.dataset.a; closeColMenu();
    const order=(COLPREF.order&&COLPREF.order.length)?COLPREF.order.slice():cols.map(c=>c.k);
    const at=order.indexOf(k);
    if(a==='Filter…'){ colFilterBox(k,cols); return; }
    else if(a==='Clear this filter'){ delete CFILT[k]; saveCFilt(); paint(); return; }
    else if(a==='Clear every filter'){ CFILT={}; saveCFilt(); paint(); return; }
    else if(a==='Sort A to Z'){ SORT={k,dir:1}; }
    else if(a==='Sort Z to A'){ SORT={k,dir:-1}; }
    else if(a==='Move left'&&at>0){ order.splice(at,1); order.splice(at-1,0,k); COLPREF.order=order; }
    else if(a==='Move right'&&at<order.length-1){ order.splice(at,1); order.splice(at+1,0,k); COLPREF.order=order; }
    else if(a==='Move to the front'){ order.splice(at,1); order.unshift(k); COLPREF.order=order; }
    else if(a==='Freeze up to this column'){ COLPREF.freeze = fz===i+1?0:i+1; }
    else if(a==='Unfreeze all'){ COLPREF.freeze=0; }
    else if(a==='Reset the width'){ delete COLPREF.w[k]; }
    else if(a==='Hide this column'){ COLPREF.hidden=(COLPREF.hidden||[]).concat([k]);
      if(COLPREF.freeze>i)COLPREF.freeze=i; }
    else if(a==='Show every column'){ COLPREF.hidden=[]; }
    saveColPref(); paintTable();
  });
}
/* the columns actually shown, in the chosen order */
function shownCols(cols){
  const hid=COLPREF.hidden||[];
  let list=cols.filter(c=>!hid.includes(c.k));
  if(COLPREF.order&&COLPREF.order.length){
    const pos=k=>{const i=COLPREF.order.indexOf(k);return i<0?999:i;};
    list=list.slice().sort((a,b)=>pos(a.k)-pos(b.k));
  }
  return list;
}
function frozenLeft(cols,i){
  let x=0; for(let j=0;j<i;j++)x+=(COLPREF.w[cols[j].k]||cols[j].w||140);
  return x;
}

/* ============================================================
   Live updates. The Supabase realtime endpoint speaks plain JSON over a
   websocket, so no library is needed. A slow poll runs underneath in case
   the socket cannot be had at all.
   ============================================================ */
let LIVEWS=null, LIVE_OK=false, _wsTries=0, _pollT=null, _syncT=null;
let LASTSEEN={};                 /* table -> the highest id we have shown */

function startLive(){
  clearInterval(_pollT);
  _pollT=setInterval(()=>{ if(!document.hidden)syncSoon(); }, 20000);
  connectLive();
}
function connectLive(){
  if(!SESSION||!window.WebSocket)return;
  try{ if(LIVEWS)LIVEWS.close(); }catch(e){}
  let ws;
  try{
    ws=new WebSocket(SB_URL.replace(/^http/,'ws')+
      '/realtime/v1/websocket?apikey='+encodeURIComponent(SB_KEY)+'&vsn=1.0.0');
  }catch(e){ return; }
  LIVEWS=ws;
  let ref=0, hb=null;
  const send=(topic,event,payload)=>{
    try{ ws.send(JSON.stringify({topic,event,payload:payload||{},ref:String(++ref)})); }catch(e){}
  };
  ws.onopen=()=>{
    send('realtime:eng','phx_join',{
      config:{broadcast:{self:false},presence:{key:''},
        postgres_changes:[
          {event:'*',schema:'public',table:'eng_shopdrawings'},
          {event:'*',schema:'public',table:'eng_asbuilts'},
          {event:'*',schema:'public',table:'eng_gis'},
          {event:'*',schema:'public',table:'eng_invoice_sections'},
          {event:'*',schema:'public',table:'eng_history'}]},
      access_token:SESSION.access_token});
    hb=setInterval(()=>send('phoenix','heartbeat',{}),25000);
  };
  ws.onmessage=e=>{
    let m=null; try{ m=JSON.parse(e.data); }catch(_){ return; }
    if(m.event==='phx_reply'&&m.payload&&m.payload.status==='ok'&&m.topic==='realtime:eng'){
      LIVE_OK=true; _wsTries=0; paintStatus&&paintStatus();
      clearInterval(_pollT);
      _pollT=setInterval(()=>{ if(!document.hidden)syncSoon(); }, 60000);
    }
    if(m.event==='postgres_changes'||m.event==='INSERT'||m.event==='UPDATE'||m.event==='DELETE')
      syncSoon(m.payload);
    if(m.event==='system'&&m.payload&&/error/i.test(m.payload.status||''))LIVE_OK=false;
  };
  const bail=()=>{
    clearInterval(hb); LIVE_OK=false; paintStatus&&paintStatus();
    clearInterval(_pollT);
    _pollT=setInterval(()=>{ if(!document.hidden)syncSoon(); }, 20000);
    if(SESSION){ const wait=Math.min(60000,2000*Math.pow(2,Math.min(_wsTries++,4)));
      setTimeout(()=>{ if(SESSION&&(!LIVEWS||LIVEWS.readyState>1))connectLive(); },wait); }
  };
  ws.onclose=bail; ws.onerror=()=>{ try{ws.close();}catch(e){} };
}
/* changes arrive in bursts; reload once when they stop */
function syncSoon(payload){
  clearTimeout(_syncT);
  _syncT=setTimeout(async()=>{
    if(document.querySelector('.cellin'))return syncSoon();   /* wait for the typing to finish */
    const before=snapshotIds();
    await loadAll();
    const fresh=newSince(before);
    paint();
    paintBell();
    if(fresh.length)announce(fresh);
  }, 600);
}
function snapshotIds(){
  const m={};
  [['shop',SD],['asbuilts',AB],['gis',GIS],['invoice',INV]].forEach(([k,arr])=>{
    m[k]=new Set((arr||[]).map(r=>r.id));
  });
  return m;
}
function newSince(before){
  const out=[];
  [['shop',SD,'shop drawing'],['asbuilts',AB,'as-built'],
   ['gis',GIS,'GIS record'],['invoice',INV,'invoice section']].forEach(([k,arr,label])=>{
    (arr||[]).forEach(r=>{ if(before[k]&&!before[k].has(r.id))out.push({label,row:r,tab:k}); });
  });
  return out;
}

/* ---- the chime, the toast and the desktop alert ---- */
let AC=null;
function audioCtx(){
  if(AC)return AC;
  const C=window.AudioContext||window.webkitAudioContext; if(!C)return null;
  try{ AC=new C(); }catch(e){ return null; }
  return AC;
}
document.addEventListener('pointerdown',()=>{
  const c=audioCtx(); if(c&&c.state==='suspended')c.resume().catch(()=>{});
});
const ALPREF=()=>{ try{ return JSON.parse(localStorage.getItem('eng_alerts')||'{}'); }catch(e){ return {}; } };
const ALSAVE=o=>{ try{ localStorage.setItem('eng_alerts',JSON.stringify(o)); }catch(e){} };
function chime(){
  const p=ALPREF(); if(p.sound===false)return;
  const c=audioCtx(); if(!c||c.state!=='running')return;
  const t=c.currentTime, vol=Math.max(0,Math.min(1,p.vol==null?0.35:p.vol));
  [[392,0],[587.33,0.09]].forEach(([hz,at],i)=>{
    const o=c.createOscillator(), g=c.createGain();
    o.type='sine'; o.frequency.value=hz;
    const peak=vol*(i?0.5:0.8), st=t+at;
    g.gain.setValueAtTime(0.0001,st);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002,peak),st+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001,st+1.15);
    o.connect(g); g.connect(c.destination);
    o.start(st); o.stop(st+1.2);
  });
}
function announce(fresh){
  if(!fresh.length)return;
  chime();
  const n=fresh.length, f=fresh[0];
  const what=(f.row.description||f.row.doc_no||f.label);
  const title=n===1?what:(n+' new records');
  const body=n===1?(f.label+(f.row.discipline?' · '+f.row.discipline:''))
                  :(what+' and '+(n-1)+' more');
  if(document.hidden&&window.Notification&&Notification.permission==='granted'){
    try{
      const note=new Notification(title,{body,tag:'eng',icon:''});
      note.onclick=()=>{ window.focus(); note.close();
        TAB=f.tab; VIEW='reg'; paint(); openSheet&&openSheet(f.row.id); };
    }catch(e){}
  }
  toast(n===1?('New — '+what):(n+' new records came in'));
}

/* ============================================================
   What the bell shows: everything that has happened lately, newest
   first — records added or changed, and submission cycles logged.
   Built from what the app already holds, so there is no separate
   notifications table to keep in step.
   ============================================================ */
const SEENKEY='eng_seen_at';
function lastSeen(){ try{ return localStorage.getItem(SEENKEY)||''; }catch(e){ return ''; } }
function markSeen(){ try{ localStorage.setItem(SEENKEY,new Date().toISOString()); }catch(e){} }

function feedItems(){
  const out=[];
  const reg=[['shop',SD,'Shop drawing'],['asbuilts',AB,'As-built'],
             ['gis',GIS,'GIS record'],['invoice',INV,'Invoice section']];
  reg.forEach(([tab,arr,label])=>{
    (arr||[]).forEach(r=>{
      const made=r.created_at||'', chg=r.updated_at||'';
      const title=r.description||r.doc_no||r.submittal_no||('#'+r.id);
      if(made)out.push({at:made,tab,id:r.id,what:'added',label,title,
        who:r.action_by||'', proj:r.project_id});
      if(chg&&chg!==made)out.push({at:chg,tab,id:r.id,what:'changed',label,title,
        who:r.action_by||'', proj:r.project_id});
    });
  });
  (HIST||[]).forEach(h=>{
    const tab=h.kind==='shop'?'shop':h.kind==='gis'?'gis':'asbuilts';
    const arr=tab==='shop'?SD:tab==='gis'?GIS:AB;
    const rec=(arr||[]).find(r=>r.id===h.record_id);
    out.push({at:h.created_at||h.submitted||'',tab,id:h.record_id,
      what: h.outcome?('came back — '+h.outcome) : 'submitted',
      label:'Rev '+(h.revision??''), title:(rec&&rec.description)||('#'+h.record_id),
      who:h.actor||''});
  });
  return out.filter(x=>x.at).sort((a,b)=>String(b.at).localeCompare(String(a.at))).slice(0,80);
}
function unseenCount(){
  const since=lastSeen(); if(!since)return 0;
  return feedItems().filter(x=>String(x.at)>since).length;
}
function paintBell(){
  const b=document.getElementById('alerts'); if(!b)return;
  const n=unseenCount();
  let dot=b.querySelector('.bdot');
  if(n){ if(!dot){ dot=document.createElement('i'); dot.className='bdot'; b.appendChild(dot); }
         dot.textContent=n>99?'99+':n; }
  else if(dot)dot.remove();
  b.title=n?(n+' new since you last looked'):'Notifications';
}
function feedBox(){
  const items=feedItems(), since=lastSeen();
  const when=t=>{
    const d=new Date(t); if(isNaN(d))return '';
    const mins=Math.round((Date.now()-d.getTime())/60000);
    if(mins<1)return 'just now';
    if(mins<60)return mins+' min ago';
    if(mins<1440)return Math.round(mins/60)+' h ago';
    return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short'});
  };
  msgBox('Notifications',
    (items.length?`<div class="feed">${items.map((x,i)=>
      `<div class="fitem${(since&&String(x.at)>since)?' new':''}" data-f="${i}">
         <div class="ft">${esc(x.title)}</div>
         <div class="fm">${esc(x.label)} · ${esc(x.what)}${x.who?' · '+esc(x.who):''}
           <span class="fw">${esc(when(x.at))}</span></div>
       </div>`).join('')}</div>`
      : '<div class="hint">Nothing has happened yet.</div>')
    + '<div style="margin-top:10px"><button class="btn" id="feedalerts">Alerts and sound…</button></div>',
    [['Done',null,'primary']]);
  const m=document.getElementById('msg');
  m.querySelectorAll('[data-f]').forEach(el=>el.onclick=()=>{
    const x=items[+el.dataset.f];
    m.classList.remove('on');
    TAB=x.tab; VIEW='reg'; paint(); openSheet(x.id);
  });
  const a=m.querySelector('#feedalerts'); if(a)a.onclick=()=>{ m.classList.remove('on'); alertsBox(); };
  markSeen(); paintBell();
}

function alertsBox(){
  const p=ALPREF(), on=p.sound!==false, v=Math.round((p.vol==null?0.35:p.vol)*100);
  const perm=window.Notification?Notification.permission:'unsupported';
  msgBox('Alerts and sound',
    `<div class="hint" style="margin-bottom:10px">The register watches for other
       people's changes and brings them in on its own. This is what it does when
       something arrives.</div>
     <label class="fl">Bell</label>
     <label style="display:flex;align-items:center;gap:8px;margin:4px 0 10px">
       <input type="checkbox" id="alsnd"${on?' checked':''}>
       <span>Play a soft chime for anything new</span></label>
     <label class="fl">Volume</label>
     <input type="range" class="f" id="alvol" min="0" max="100" value="${v}" style="padding:0;height:26px">
     <div style="margin-top:8px"><button class="btn" id="altest">Hear it</button></div>
     <label class="fl" style="margin-top:12px">Desktop alerts</label>
     <div class="hint">${perm==='granted'?'On — alerts appear when this tab is in the background.'
        :perm==='denied'?'Blocked by the browser. Turn them back on in the padlock menu beside the address bar.'
        :perm==='unsupported'?'This browser cannot show desktop alerts.'
        :'Off — the browser will ask you once.'}</div>
     ${perm==='default'?'<div style="margin-top:6px"><button class="btn" id="alask">Turn on desktop alerts</button></div>':''}
     <div class="hint" style="margin-top:12px">Updates arrive
       <b>${LIVE_OK?'live, within a second':'about every 20 seconds'}</b>.</div>`,
    [['Done',null,'primary']]);
  const m=document.getElementById('msg');
  const snd=m.querySelector('#alsnd'), vol=m.querySelector('#alvol');
  const apply=()=>{ const q=ALPREF(); q.sound=snd.checked; q.vol=(+vol.value||0)/100; ALSAVE(q); };
  snd.onchange=apply;
  vol.onchange=()=>{ apply(); chime(); };
  const t=m.querySelector('#altest'); if(t)t.onclick=()=>{ apply(); chime(); };
  const k=m.querySelector('#alask'); if(k)k.onclick=()=>{ askForAlerts(); };
}
function askForAlerts(){

/* ============================================================
   Windows — the same manager the LOD tracker uses: drag by the bar,
   resize from the edges, snap to half or full by dragging to an edge,
   minimise to the taskbar, and a dock along the bottom.
   ============================================================ */
const WINS=new Map(); let winSeq=0, focused=null;
const desk=()=>document.getElementById('desktop');
let WINMODE=false;                       /* off until the first window opens */

function setWinMode(on){
  WINMODE=on;
  document.body.classList.toggle('windowed',on);
  const d=desk(), k=document.getElementById('dock');
  if(d)d.style.display=on?'block':'none';
  if(k)k.style.display=on?'flex':'none';
  const wrap=document.getElementById('wrap');
  if(wrap)wrap.style.display=on?'none':'';
}
function createWindow(kind,title,sub,draw,x,y,w,h){
  const ex=[...WINS.values()].find(v=>v.kind===kind);
  if(ex){ focusWin(ex.id); return ex; }
  if(!WINMODE)setWinMode(true);
  const id='w'+(++winSeq), D=desk();
  const win={id,kind,title,sub,draw,min:false,max:false,
    x:x??(24+WINS.size*26), y:y??(18+WINS.size*22),
    w:w??Math.min(1180,D.clientWidth-60), h:h??Math.min(660,D.clientHeight-50)};
  const el=document.createElement('div');
  el.className='win'; el.id=id;
  el.innerHTML=`<div class="wbar"><div class="wt">${esc(title)}<small>${esc(sub||'')}</small></div>
      <button class="wb" data-w="min" title="Minimise">–</button>
      <button class="wb" data-w="max" title="Maximise">▢</button>
      <button class="wb" data-w="close" title="Close">✕</button></div>
    <div class="wbody"></div>
    <div class="grip e"></div><div class="grip s"></div><div class="grip se"></div>`;
  D.appendChild(el);
  win.el=el; win.body=el.querySelector('.wbody');
  WINS.set(id,win); applyRect(win); focusWin(id);
  el.addEventListener('pointerdown',()=>focusWin(id),true);
  el.querySelector('.wbar').addEventListener('pointerdown',e=>{
    if(e.target.closest('.wb'))return; startDrag(e,win);});
  el.querySelectorAll('.wb').forEach(b=>b.onclick=()=>{
    const a=b.dataset.w;
    if(a==='close')closeWin(id);
    else if(a==='min'){win.min=true;applyRect(win);renderDock();}
    else{win.max=!win.max;applyRect(win);}});
  el.querySelector('.grip.e').addEventListener('pointerdown',e=>startResize(e,win,1,0));
  el.querySelector('.grip.s').addEventListener('pointerdown',e=>startResize(e,win,0,1));
  el.querySelector('.grip.se').addEventListener('pointerdown',e=>startResize(e,win,1,1));
  drawWin(win); renderDock();
  return win;
}
function drawWin(w){
  const keepT=PAINT_TARGET, keepTab=TAB, keepView=VIEW;
  try{
    PAINT_TARGET=w.body;
    if(w.tab)TAB=w.tab;
    if(w.view)VIEW=w.view;
    w.draw(w);
  }catch(e){
    w.body.innerHTML='<div class="empty"><b>Could not draw this window</b><br>'+esc(e.message)+'</div>';
  }finally{ PAINT_TARGET=keepT; TAB=keepTab; VIEW=keepView; }
}
function redrawWins(){ WINS.forEach(w=>drawWin(w)); renderDock(); }
function applyRect(w){
  const D=desk(), el=w.el;
  if(w.min){el.style.display='none';return;}
  el.style.display='flex';
  if(w.max){Object.assign(el.style,{left:'6px',top:'6px',
    width:(D.clientWidth-12)+'px',height:(D.clientHeight-12)+'px'});return;}
  w.x=Math.max(-w.w+120,Math.min(w.x,D.clientWidth-80));
  w.y=Math.max(0,Math.min(w.y,D.clientHeight-40));
  Object.assign(el.style,{left:w.x+'px',top:w.y+'px',width:w.w+'px',height:w.h+'px'});
}
function focusWin(id){
  focused=id;
  [...WINS.values()].forEach(w=>w.el.classList.toggle('focus',w.id===id));
  const w=WINS.get(id);
  if(w){ w.el.style.zIndex=++winSeq+100;
    if(w.min){w.min=false;applyRect(w);renderDock();} }
}
function closeWin(id){
  const w=WINS.get(id); if(!w)return;
  w.el.remove(); WINS.delete(id); renderDock();
  if(!WINS.size)setWinMode(false);          /* back to the plain view */
}
function arrangeWins(){
  const list=[...WINS.values()].filter(w=>!w.min); if(!list.length)return;
  const D=desk(), cols=Math.ceil(Math.sqrt(list.length)), rows=Math.ceil(list.length/cols);
  list.forEach((w,i)=>{ w.max=false;
    w.w=Math.floor(D.clientWidth/cols)-10; w.h=Math.floor(D.clientHeight/rows)-10;
    w.x=(i%cols)*(w.w+8)+6; w.y=Math.floor(i/cols)*(w.h+8)+6; applyRect(w);});
  toast('Windows tidied');
}
function renderDock(){
  const d=document.getElementById('dock'); if(!d)return;
  const t=document.getElementById('tidybtn'); if(t)t.style.display=WINS.size?'':'none';
  d.innerHTML=[...WINS.values()].map(w=>
      `<button data-d="${w.id}"${w.id===focused?' class="on"':''}>${w.min?'▫ ':''}${esc(w.title)}</button>`).join('')
    +`<span class="st">${dockStatus()}</span>`;
  d.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>focusWin(b.dataset.d));
}
function dockStatus(){
  const n=rowsOf(TAB).length, label=(TABS.find(t=>t.k===TAB)||{}).t||'';
  return '● live · '+n+' '+String(label).toLowerCase()+
    ' · '+(PROJ?projName(PROJ):'All projects')+
    (ME?' · '+ME.name:'')+' · build '+BUILD;
}
let _drag=null;
function startDrag(e,w){
  if(w.max)return;
  _drag={w,dx:e.clientX-w.x,dy:e.clientY-w.y,mode:'move'};
  try{e.target.setPointerCapture(e.pointerId);}catch(_){}
  document.addEventListener('pointermove',dragMove);
  document.addEventListener('pointerup',dragEnd,{once:true});
}
function startResize(e,w,ex,ey){
  if(w.max)return;
  _drag={w,sx:e.clientX,sy:e.clientY,w0:w.w,h0:w.h,ex,ey,mode:'size'};
  try{e.target.setPointerCapture(e.pointerId);}catch(_){}
  document.addEventListener('pointermove',dragMove);
  document.addEventListener('pointerup',dragEnd,{once:true});
  e.preventDefault();
}
function dragMove(e){
  if(!_drag)return;
  const w=_drag.w, D=desk(), g=document.getElementById('snapghost');
  if(_drag.mode==='move'){
    w.x=e.clientX-_drag.dx; w.y=e.clientY-_drag.dy; applyRect(w);
    const r=D.getBoundingClientRect(), px=e.clientX-r.left, py=e.clientY-r.top;
    let z=null;
    if(px<28)z={left:0,top:0,width:D.clientWidth/2,height:D.clientHeight};
    else if(px>D.clientWidth-28)z={left:D.clientWidth/2,top:0,width:D.clientWidth/2,height:D.clientHeight};
    else if(py<10)z={left:0,top:0,width:D.clientWidth,height:D.clientHeight};
    _drag.zone=z;
    if(z&&g)Object.assign(g.style,{display:'block',left:z.left+'px',top:z.top+'px',
      width:z.width+'px',height:z.height+'px'});
    else if(g)g.style.display='none';
  }else{
    if(_drag.ex)w.w=Math.max(340,_drag.w0+(e.clientX-_drag.sx));
    if(_drag.ey)w.h=Math.max(190,_drag.h0+(e.clientY-_drag.sy));
    applyRect(w);
  }
}
function dragEnd(){
  document.removeEventListener('pointermove',dragMove);
  const g=document.getElementById('snapghost'); if(g)g.style.display='none';
  if(_drag&&_drag.zone){ const w=_drag.w,z=_drag.zone;
    w.x=z.left;w.y=z.top;w.w=z.width;w.h=z.height;w.max=false;applyRect(w); }
  _drag=null;
}
window.addEventListener('resize',()=>WINS.forEach(w=>applyRect(w)));
/* open whatever is on screen as a window */
function openCurrentAsWindow(){
  if(isPhone())return;          /* one screen at a time on a phone */
  if(VIEW==='reg')      openRegisterWindow(TAB);
